<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero · Escuela Futura</title>
<script>
  (function () { try { var q = new URLSearchParams(location.search).get('tema'); var t = q || localStorage.getItem('tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {} })();
</script>
<style>
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Bold.ttf"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Regular.otf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Medium.otf"); font-weight: 500 600; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Bold.otf"); font-weight: 700; font-display: block; }
  :root { color-scheme: dark; --ink: #1a1a2e; --texto: #f4efe2; --suave: #9a9eba; --tenue: #6b6f8a; --acento: #ff7a3d; --azul: #3e6be8; --ok: #5fae6a; --fondo: #0b0b12; --panel: #10101b; --tarjeta: #181826; --linea: #2c2f48; --campo: #1b1b2b;
    --c-direccion: #ff7a3d; --c-secretaria: #44c9b3; --c-docente: #f0c13f; --c-bienestar: #f07fb0; --c-admisiones: #e0b84a; --c-academica: #6fd987; --c-otro: #9a9eba;
    --mono: "Silkscreen", "Press Start 2P", ui-monospace, Menlo, monospace; --sans: "Plain", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  :root[data-tema="claro"] { color-scheme: light; --ink: #1a1a2e; --texto: #121212; --suave: #5c5f73; --tenue: #8a8d9e; --acento: #c2410c; --azul: #2f54c8; --ok: #2f7a3b; --fondo: #e9e2d3; --panel: #f9f4ea; --tarjeta: #ffffff; --linea: #d6cdb9; --campo: #ffffff;
    --c-direccion: #c2410c; --c-secretaria: #0d6e60; --c-docente: #7d6000; --c-bienestar: #b4306a; --c-admisiones: #7e6212; --c-academica: #1d7a42; --c-otro: #5c5f73; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; font-family: var(--sans); color: var(--texto); }
  .px { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }
  #escenario { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--panel); display: flex; flex-direction: column; }
  /* Mismo conmutador que en la escuela; embebido no se muestra (lo pone la vista madre) */
  #vistas { position: fixed; right: 14px; top: 10px; z-index: 60; display: flex; background: var(--ink); padding: 4px; gap: 4px; }
  body.embebido #vistas { display: none; }
  #vistas button { font: 700 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: transparent; color: #f4efe2; border: 0; padding: 8px 14px; cursor: pointer; }
  #vistas button.on { background: var(--acento); color: var(--ink); } #vistas button:hover:not(.on) { background: #2c2f48; }
  #vistas kbd { font: inherit; background: rgba(255,255,255,.14); padding: 2px 8px; margin-left: 8px; }

  header { flex: none; display: flex; align-items: center; gap: 28px; padding: 30px 720px 22px 56px; }   /* a la derecha va el conmutador de vistas, fijo */
  header h1 { margin: 0; font: 700 34px var(--mono); letter-spacing: .06em; text-transform: uppercase; } header h1 span { color: var(--acento); }
  header .hueco { flex: 1; }
  .modos { display: flex; background: var(--linea); padding: 3px; gap: 3px; }
  .modos button { font: 700 18px var(--sans); letter-spacing: .05em; text-transform: uppercase; background: transparent; color: var(--texto); border: 0; padding: 9px 18px; cursor: pointer; }
  .modos button.on { background: var(--panel); }
  #mas { font: 700 18px var(--sans); letter-spacing: .05em; text-transform: uppercase; background: var(--acento); color: var(--ink); border: 0; padding: 12px 18px; cursor: pointer; }
  #mas:disabled { opacity: .4; cursor: default; }
  #cuerpo { flex: 1; min-height: 0; padding: 0 56px 40px; position: relative; }
  #vacio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--suave); font: 600 30px/1.4 var(--sans); padding: 0 300px; }
  #vacio small { display: block; margin-top: 12px; font-size: 22px; color: var(--tenue); }

  /* Kanban: cuatro columnas iguales, tarjetas planas */
  #kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; height: 100%; }
  .col { display: flex; flex-direction: column; min-height: 0; border-top: 4px solid var(--linea); padding-top: 14px; }
  .col.sobre { background: color-mix(in srgb, var(--azul) 10%, transparent); }
  .col.lista { border-top-color: var(--ok); } .col.revision { border-top-color: var(--azul); }
  .col h2 { margin: 0 0 16px; display: flex; align-items: baseline; gap: 12px; font: 700 22px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--texto); }
  .col h2 small { font: 600 20px var(--sans); color: var(--tenue); }
  .col .pila { flex: 1; min-height: 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
  .tj { background: var(--tarjeta); border: 3px solid var(--linea); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; cursor: grab; }
  .tj:active { cursor: grabbing; } .tj.arrastrando { opacity: .4; }
  .tj.quieta { cursor: default; }
  .tj .que { font: 700 26px/1.25 var(--sans); color: var(--texto); }
  .tj .fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .quien { display: inline-flex; align-items: center; gap: 8px; font: 700 17px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--texto); }
  .quien::before { content: ''; width: 12px; height: 12px; background: var(--c); }
  .caso { font: 600 18px var(--sans); color: var(--suave); }
  .chip { font: 700 14px var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; background: var(--linea); color: var(--suave); }
  .nota { font: 500 18px/1.3 var(--sans); color: var(--suave); font-style: italic; }

  /* Lista: agrupada por tarea; el estado se cambia con un selector */
  #lista { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 36px; scrollbar-width: thin; }
  .grupo { display: flex; flex-direction: column; }
  .grupo .cab { display: flex; align-items: center; gap: 16px; padding: 0 0 12px; border-bottom: 3px solid var(--linea); }
  .grupo .cab h2 { margin: 0; font: 700 28px var(--sans); color: var(--texto); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grupo .cab .avance { font: 600 20px var(--sans); color: var(--suave); }
  .grupo .cab .estado { font: 700 15px var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; background: var(--linea); color: var(--texto); }
  .grupo .cab .estado.lista { background: var(--ok); color: var(--ink); } .grupo .cab .estado.revision { background: var(--azul); color: #f4efe2; }
  .ren { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--linea); }
  .ren select { font: 700 16px var(--sans); letter-spacing: .04em; text-transform: uppercase; background: var(--campo); color: var(--texto); border: 2px solid var(--linea); padding: 8px 10px; width: 100%; }
  .ren select:disabled { opacity: .6; }
  .ren .que { font: 600 24px/1.25 var(--sans); color: var(--texto); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .ren.descartada .que { text-decoration: line-through; color: var(--tenue); }
  .ren .estado-fijo { font: 700 15px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); }
  .nueva { display: grid; grid-template-columns: 200px minmax(0, 1fr) 260px auto; gap: 14px; align-items: center; padding: 12px 0 0; }
  .nueva input { font: 600 20px var(--sans); background: var(--campo); color: var(--texto); border: 2px solid var(--linea); padding: 10px 12px; width: 100%; outline: none; }
  .nueva input:focus { border-color: var(--acento); }
  .nueva button { font: 700 16px var(--sans); letter-spacing: .05em; text-transform: uppercase; background: transparent; color: var(--texto); border: 2px solid var(--linea); padding: 10px 14px; cursor: pointer; }
  .nueva button:hover { border-color: var(--suave); }
  .nueva .rot { font: 700 15px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); }
  #aviso { position: absolute; left: 56px; bottom: 16px; font: 600 18px var(--sans); color: var(--acento); }
  #form-tarea { display: none; gap: 12px; align-items: center; }
  #form-tarea.abierto { display: flex; }
  #form-tarea input { font: 600 20px var(--sans); background: var(--campo); color: var(--texto); border: 2px solid var(--linea); padding: 10px 12px; width: 420px; outline: none; }
  #form-tarea input:focus { border-color: var(--acento); }
  #form-tarea button { font: 700 16px var(--sans); letter-spacing: .05em; text-transform: uppercase; background: transparent; color: var(--texto); border: 2px solid var(--linea); padding: 10px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="vistas" class="px"><button id="v-escuela">Escuela</button><button id="v-org">Organigrama <kbd>o</kbd></button><button id="v-tab" class="on">Tablero <kbd>b</kbd></button></div>
<div id="escenario">
  <header>
    <h1>Escuela <span>Futura</span> · Tablero</h1>
    <div class="modos px"><button id="m-kanban" class="on">Kanban</button><button id="m-lista">Lista</button></div>
    <button id="mas" type="button" disabled>+ Tarea</button>
    <div id="form-tarea"><input id="titulo-nuevo" placeholder="Título de la tarea" maxlength="120"><button id="crear-tarea" type="button">Crear</button></div>
  </header>
  <div id="cuerpo">
    <div id="vacio">Todavía no hay tareas.<small>Nacen cuando aprobás una propuesta en el chat, o con + Tarea.</small></div>
    <div id="kanban" hidden></div>
    <div id="lista" hidden></div>
    <div id="aviso"></div>
  </div>
</div>

<script type="module">
import { crearTablero, ESTADOS, ETIQUETAS, estadoDeTarea, puedeMover } from './tablero.js';

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const embebido = params.has('embebido');
document.body.classList.toggle('embebido', embebido);
let tema = document.documentElement.dataset.tema === 'claro' ? 'claro' : 'oscuro';
const aplicarTema = (t) => { tema = t === 'claro' ? 'claro' : 'oscuro'; document.documentElement.dataset.tema = tema; try { localStorage.setItem('tema', tema); } catch {} };
const modelo = crearTablero();
let vivo = false, modo = 'kanban';
try { modo = localStorage.getItem('tableroModo') === 'lista' ? 'lista' : 'kanban'; } catch {}

// ── Datos: embebido, la vista madre manda los eventos `tarea`; suelto, se conecta al servidor por SSE ──
const irA = (cual) => { if (embebido) parent.postMessage({ tipo: 'vista', cual }, '*'); else location.href = cual === 'escuela' ? 'index.html' : cual === 'org' ? 'organigrama.html' : 'tablero.html'; };
$('#v-escuela').onclick = () => irA('escuela'); $('#v-org').onclick = () => irA('org');
addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.tipo === 'tema') aplicarTema(d.tema);
  if (d.tipo === 'tablero') { if (d.reiniciar) modelo.reiniciar(); for (const ev of d.eventos || []) modelo.aplicar(ev); if (typeof d.vivo === 'boolean') vivo = d.vivo; dibujar(); }
});
if (embebido) parent.postMessage({ tipo: 'tablero-listo' }, '*');
else {
  const s = new EventSource('/api/eventos');
  s.addEventListener('estado', () => { vivo = true; dibujar(); });
  s.addEventListener('snapshot', (e) => { try { modelo.reiniciar(); for (const ev of JSON.parse(e.data).eventos || []) modelo.aplicar(ev); dibujar(); } catch {} });
  s.addEventListener('eventos', (e) => { try { for (const ev of JSON.parse(e.data)) modelo.aplicar(ev); dibujar(); } catch {} });
  s.addEventListener('reinicio', () => { modelo.reiniciar(); dibujar(); });
  s.onerror = () => { vivo = false; dibujar(); };
}

// ── Operar (solo en vivo): la persona mueve, asigna y crea; el servidor valida y emite ──
let avisoHasta = 0;
const aviso = (t) => { $('#aviso').textContent = t; avisoHasta = Date.now() + 4000; setTimeout(() => { if (Date.now() >= avisoHasta) $('#aviso').textContent = ''; }, 4100); };
async function operar(op) {
  if (!vivo) { aviso('En grabación el Tablero solo se mira.'); return false; }
  try {
    const r = await fetch('/api/tablero', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(op) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'No se pudo.');
    if (!embebido) modelo.aplicar(d.evento);   // embebido, el evento vuelve por la vista madre
    dibujar(); return true;
  } catch (e) { aviso(e.message); return false; }
}

// ── Dibujo ──
const el = (tag, clase, texto) => { const e = document.createElement(tag); if (clase) e.className = clase; if (texto != null) e.textContent = texto; return e; };
const colorDe = (resp) => { const r = String(resp || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); return r.includes('secretar') ? 'var(--c-secretaria)' : r.includes('docente') || r.includes('tutor') ? 'var(--c-docente)' : r.includes('bienestar') ? 'var(--c-bienestar)' : r.includes('admisi') ? 'var(--c-admisiones)' : r.includes('academ') ? 'var(--c-academica)' : r ? 'var(--c-direccion)' : 'var(--c-otro)'; };
const NOMBRES = { coordinacion: 'Coordinación', tutor: 'Tutor', advisor: 'Advisor', bienestar: 'Bienestar', admisiones: 'Admisiones', academia: 'Academia' };
function quien(s) { const q = el('span', 'quien', s.responsable || 'sin responsable'); q.style.setProperty('--c', colorDe(s.responsable)); return q; }
function chips(s, conCaso) {
  const f = el('div', 'fila'); f.appendChild(quien(s));
  if (conCaso) f.appendChild(el('span', 'caso', s.tarea.titulo));
  if (NOMBRES[s.creadaPor]) f.appendChild(el('span', 'chip px', 'propuesta por ' + NOMBRES[s.creadaPor]));
  if (s.estado === 'revision' && NOMBRES[s.movidaPor]) f.appendChild(el('span', 'chip px', 'revisó ' + NOMBRES[s.movidaPor]));
  return f;
}
function dibujar() {
  const subs = modelo.subtareas; const hay = modelo.tareas.length > 0;
  $('#vacio').style.display = hay ? 'none' : 'grid'; $('#kanban').hidden = !hay || modo !== 'kanban'; $('#lista').hidden = !hay || modo !== 'lista';
  $('#m-kanban').classList.toggle('on', modo === 'kanban'); $('#m-lista').classList.toggle('on', modo === 'lista');
  $('#mas').disabled = !vivo;
  // Kanban
  const k = $('#kanban'); k.replaceChildren();
  for (const est of ESTADOS) {
    const col = el('section', 'col ' + est); const h = el('h2', null, ETIQUETAS[est]); const lista = subs.filter((s) => s.estado === est); h.appendChild(el('small', null, String(lista.length))); col.appendChild(h);
    const pila = el('div', 'pila');
    for (const s of lista) {
      const tj = el('article', 'tj px' + (vivo ? '' : ' quieta')); tj.draggable = vivo; tj.dataset.id = s.id;
      tj.appendChild(el('div', 'que', s.texto)); tj.appendChild(chips(s, true)); if (s.nota) tj.appendChild(el('div', 'nota', s.nota));
      tj.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', s.id); e.dataTransfer.effectAllowed = 'move'; tj.classList.add('arrastrando'); });
      tj.addEventListener('dragend', () => tj.classList.remove('arrastrando'));
      pila.appendChild(tj);
    }
    col.appendChild(pila);
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', () => col.classList.remove('sobre'));
    col.addEventListener('drop', (e) => { e.preventDefault(); col.classList.remove('sobre'); const id = e.dataTransfer.getData('text/plain'); const s = modelo.subtarea(id); if (s && s.estado !== est) operar({ op: 'mover', id, estado: est }); });
    k.appendChild(col);
  }
  // Lista
  const l = $('#lista'); l.replaceChildren();
  for (const t of modelo.tareas) {
    const g = el('section', 'grupo'); const cab = el('div', 'cab'); cab.appendChild(el('h2', null, t.titulo));
    const vivas = t.subtareas.filter((s) => s.estado !== 'descartada'); const listas = vivas.filter((s) => s.estado === 'lista').length;
    cab.appendChild(el('span', 'avance', `${listas} de ${vivas.length}`)); const estT = estadoDeTarea(t); cab.appendChild(el('span', 'estado px ' + estT, ETIQUETAS[estT])); g.appendChild(cab);
    for (const s of t.subtareas) {
      const r = el('div', 'ren ' + s.estado);
      if (s.estado === 'descartada') r.appendChild(el('span', 'estado-fijo', 'Descartada'));
      else { const sel = el('select'); for (const est of ESTADOS) { const o = el('option', null, ETIQUETAS[est]); o.value = est; o.selected = est === s.estado; sel.appendChild(o); } sel.disabled = !vivo; sel.onchange = () => operar({ op: 'mover', id: s.id, estado: sel.value }).then((ok) => { if (!ok) sel.value = s.estado; }); r.appendChild(sel); }
      const que = el('div', 'que'); que.append(s.texto); if (s.nota) que.appendChild(el('span', 'nota', s.nota)); r.appendChild(que);
      r.appendChild(chips({ ...s, tarea: t }, false)); g.appendChild(r);
    }
    if (vivo) {
      const n = el('form', 'nueva'); n.appendChild(el('span', 'rot', '+ acción'));
      const txt = el('input'); txt.placeholder = 'Qué hay que hacer'; txt.maxLength = 120; const resp = el('input'); resp.placeholder = 'Quién (Secretaría, docente, Dirección…)'; resp.maxLength = 60;
      const b = el('button', null, 'Agregar'); b.type = 'submit'; n.append(txt, resp, b);
      n.onsubmit = async (e) => { e.preventDefault(); if (!txt.value.trim()) return; if (await operar({ op: 'sub', tarea: t.id, texto: txt.value, responsable: resp.value })) { txt.value = ''; resp.value = ''; } };
      g.appendChild(n);
    }
    l.appendChild(g);
  }
}
$('#m-kanban').onclick = () => { modo = 'kanban'; try { localStorage.setItem('tableroModo', modo); } catch {} dibujar(); };
$('#m-lista').onclick = () => { modo = 'lista'; try { localStorage.setItem('tableroModo', modo); } catch {} dibujar(); };
$('#mas').onclick = () => { $('#form-tarea').classList.toggle('abierto'); $('#titulo-nuevo').focus(); };
$('#crear-tarea').onclick = async () => { const t = $('#titulo-nuevo').value.trim(); if (!t) return; if (await operar({ op: 'crear', titulo: t })) { $('#titulo-nuevo').value = ''; $('#form-tarea').classList.remove('abierto'); modo = 'lista'; dibujar(); } };
$('#titulo-nuevo').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#crear-tarea').click(); } if (e.key === 'Escape') $('#form-tarea').classList.remove('abierto'); });
dibujar();

// ── Escala a la ventana y teclas ──
const esc = $('#escenario');
function escalar() { const f = Math.min(innerWidth / 1920, innerHeight / 1080); esc.style.transform = `translate(${(innerWidth - 1920 * f) / 2}px, ${(innerHeight - 1080 * f) / 2}px) scale(${f})`; }
addEventListener('resize', escalar); escalar();
addEventListener('keydown', (e) => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape' || e.key === 'b') irA('escuela');
  if (e.key === 'o') irA('org');
  if (e.key === 'k') $('#m-kanban').click(); if (e.key === 'l') $('#m-lista').click();
  if (e.key === 't') { aplicarTema(tema === 'oscuro' ? 'claro' : 'oscuro'); if (embebido) parent.postMessage({ tipo: 'tema', tema }, '*'); }
  if (e.key === 'f' && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
});
</script>
</body>
</html>
