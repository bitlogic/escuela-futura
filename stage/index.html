<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuela Futura</title>
<script>
  // El tema se aplica antes del primer cuadro para no ver un destello del otro. ?tema= manda; si no, lo guardado; si no, oscuro.
  (function () { try { var q = new URLSearchParams(location.search).get('tema'); var t = q || localStorage.getItem('tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {} })();
</script>
<style>
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Regular.ttf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Bold.ttf"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Regular.otf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Medium.otf"); font-weight: 500 600; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Bold.otf"); font-weight: 700; font-display: block; }

  /* Colores por función, no por tono. El oscuro es el tema original; el claro usa el papel crema del brand kit. */
  :root { color-scheme: dark;
    --fondo-pagina: #0b0b12; --panel: #10101b; --panel-borde: #2c2f48; --texto: #f4efe2; --texto-suave: #9a9eba; --texto-tenue: #8f93b0; --texto-apagado: #6b6f8a; --hora: #a7abc9;
    --acento: #ff7a3d; --ok: #5fae6a; --azul: #3e6be8; --sobre-azul: #f4efe2; --mencion: #ffb48a;
    --campo: #1b1b2b; --manija: #4a4f78; --boton: #2c2f48; --boton-hover: #3c4066; --boton-texto: #f4efe2;
    --globo-fondo: #f4efe2; --globo-texto: #1a1a2e; --globo-borde: #1a1a2e; --etiqueta-fondo: #1a1a2e; --etiqueta-texto: #f4efe2; --cartel-fondo: #1a1a2e; --cartel-texto: #dfe2f5;
    --ink: #1a1a2e;
    --esc: 1;   /* escala tipográfica: 1 en 1920×1080, baja en pantallas chicas (la pone escalar()) */
    --mono: "Silkscreen", "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Plain", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  :root[data-tema="claro"] { color-scheme: light;
    --fondo-pagina: #e9e2d3; --panel: #f9f4ea; --panel-borde: #d6cdb9; --texto: #121212; --texto-suave: #5c5f73; --texto-tenue: #585c72; --texto-apagado: #6f738a; --hora: #5c5f73;
    --acento: #c2410c; --ok: #2f7a3b; --azul: #2f54c8; --sobre-azul: #f9f4ea; --mencion: #b4431a;
    --campo: #ffffff; --manija: #b9af9a; --boton: #e6dfcd; --boton-hover: #d8cfb9; --boton-texto: #121212;
    --globo-fondo: #f4efe2; --globo-texto: #1a1a2e; --globo-borde: #1a1a2e; --etiqueta-fondo: #1a1a2e; --etiqueta-texto: #f4efe2; --cartel-fondo: #1a1a2e; --cartel-texto: #f4efe2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo-pagina); overflow: hidden; font-family: var(--mono); cursor: default; }

  /* Layout fluido: el chat es una columna real; la escuela ocupa el resto y se escala por aspecto. */
  #escenario { position: fixed; inset: 0; display: flex; background: var(--fondo-pagina); }
  #mundo { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--fondo-pagina); }
  #mapa { position: absolute; left: 0; top: 0; --u: 1.25; }
  canvas#lienzo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: auto; }
  #capa { position: absolute; inset: 0; pointer-events: none; }

  /* Chat del canal */
  #chat { position: relative; flex: none; width: clamp(360px, var(--cw, 31vw), 55vw); display: flex; flex-direction: column; background: var(--panel); border-right: 4px solid var(--panel-borde); color: var(--texto); }
  #chat { container-type: inline-size; }
  @container (max-width: 560px) { #chat-cab { font-size: calc(24px * var(--esc)); padding: calc(18px * var(--esc)) calc(20px * var(--esc)); gap: 6px 12px; flex-wrap: wrap; letter-spacing: 0; } #chat-cab .canal { min-width: 0; white-space: nowrap; } .r { display: grid; grid-template-columns: calc(40px * var(--esc)) minmax(0, 1fr); column-gap: 12px; row-gap: 0; } .r .av { grid-row: 1 / 3; } .r b { font-size: calc(17px * var(--esc)); } #riel .r:nth-last-child(n+4) { display: none; } #chat-estado { white-space: nowrap; font-size: calc(16px * var(--esc)); } #msgs, #trabajando { padding-left: calc(20px * var(--esc)); padding-right: calc(20px * var(--esc)); } #redactar { padding-left: calc(20px * var(--esc)); padding-right: calc(20px * var(--esc)); } #texto { font-size: calc(24px * var(--esc)); text-overflow: ellipsis; } }
  #chat-cab { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(22px * var(--esc)) calc(28px * var(--esc)); border-bottom: 4px solid var(--panel-borde); font-weight: 700; font-size: calc(24px * var(--esc)); letter-spacing: 0; }
  #chat-cab .canal { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-cab .canal b { color: var(--acento); }
  #chat-estado { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 10px; font-size: calc(16px * var(--esc)); letter-spacing: .1em; text-transform: uppercase; color: var(--texto-tenue); }
  #chat-estado::before { content: ''; width: 12px; height: 12px; background: var(--texto-apagado); }
  #chat-estado.vivo { color: var(--ok); } #chat-estado.vivo::before { background: var(--ok); animation: parpadeo 1.2s steps(2) infinite; }
  #msgs { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: calc(26px * var(--esc)) calc(28px * var(--esc)); }
  #msgs .vacio { color: var(--texto-suave); font: 600 calc(24px * var(--esc))/1.4 var(--sans); text-align: center; margin: auto 0; }
  /* Riel: los mensajes ya leídos, de a una línea. Foco: el último, completo. */
  #riel { flex: none; display: flex; flex-direction: column; gap: calc(10px * var(--esc)); }
  #riel:not(:empty) { padding-bottom: calc(20px * var(--esc)); margin-bottom: calc(22px * var(--esc)); border-bottom: 3px solid var(--panel-borde); }
  .r { display: flex; align-items: center; gap: 14px; min-width: 0; color: var(--c); }
  .r .av { flex: none; width: calc(40px * var(--esc)); height: calc(40px * var(--esc)); background: var(--c); overflow: hidden; }
  .r .av img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .r b { flex: none; font-size: calc(19px * var(--esc)); letter-spacing: .08em; text-transform: uppercase; }
  .r span { min-width: 0; flex: 1; font: 600 calc(22px * var(--esc))/1.2 var(--sans); color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foco { flex: 1; min-height: 0; overflow-y: auto; position: relative; scrollbar-width: none; }
  #foco::-webkit-scrollbar { display: none; }
  #msgs.fijado #riel { display: none; }   /* con la propuesta fijada, todo el panel es para leerla */
  .f { --t: 34px; display: grid; grid-template-columns: calc(56px * var(--esc)) minmax(0, 1fr); column-gap: calc(18px * var(--esc)); row-gap: 6px; animation: entra .4s steps(6) both; }
  .f .av { grid-row: 1 / 3; width: calc(56px * var(--esc)); height: calc(56px * var(--esc)); background: var(--c); overflow: hidden; }
  .f .av img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .f .nom { font-weight: 700; font-size: calc(21px * var(--esc)); letter-spacing: .08em; text-transform: uppercase; color: var(--c); align-self: end; }
  .f .nom small { font-size: calc(16px * var(--esc)); color: var(--hora); margin-left: 12px; letter-spacing: .04em; }
  .f .cuerpo { font: 600 var(--t)/1.36 var(--sans); color: var(--texto); overflow-wrap: anywhere; }
  .f .cuerpo p { margin: 0 0 .5em; }
  .f .cuerpo .it { margin: .9em 0 .1em; font-weight: 700; }
  .f .cuerpo .it i { font-style: normal; color: var(--c); margin-right: .45em; }
  .f .cuerpo .de { margin: 0 0 .1em; padding-left: 1.35em; color: var(--texto-suave); font-weight: 600; }
  .f .a { color: var(--mencion); }
  #foco.recortado:not(.al-final) { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent); }
  #msgs.recortado.al-final::after { display: none; }
  #msgs.recortado::after { content: 'sigue abajo ↓'; position: absolute; right: calc(28px * var(--esc)); bottom: calc(26px * var(--esc)); padding: 4px 10px; background: var(--panel); color: var(--acento); font: 700 calc(17px * var(--esc))/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .f.persona .cuerpo { padding: 12px 14px; margin: 6px -14px 0; background: color-mix(in srgb, var(--c) 12%, transparent); }
  /* La decisión de la persona: el mensaje que cierra la propuesta, en azul */
  .f.decision .cuerpo { background: var(--azul); color: var(--sobre-azul); font-weight: 700; animation: sube .5s steps(5) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes sube { from { transform: translateY(16px); } to { transform: none; } }
  #trabajando { flex: none; min-height: calc(74px * var(--esc)); padding: calc(18px * var(--esc)) calc(28px * var(--esc)); border-top: 4px solid var(--panel-borde); font-size: calc(21px * var(--esc)); letter-spacing: .06em; text-transform: uppercase; color: var(--texto-tenue); display: flex; align-items: center; gap: 12px; }
  #trabajando.on { color: var(--texto); } #trabajando.on::before { content: ''; flex: none; width: 12px; height: 12px; background: var(--acento); animation: parpadeo .9s steps(2) infinite; }

  /* La caja para escribir. Mientras hay una propuesta sin responder, pide la decisión. */
  #redactar { flex: none; display: flex; flex-direction: column; gap: 8px; padding: calc(14px * var(--esc)) calc(28px * var(--esc)) calc(22px * var(--esc)); }
  #decidir { display: none; align-items: center; gap: 12px; color: var(--texto); font: 700 calc(22px * var(--esc))/1 var(--sans); }
  #decidir::before { content: ''; width: 14px; height: 14px; background: var(--azul); animation: respiro 2.2s cubic-bezier(.25, 1, .5, 1) infinite; }
  #redactar.esperando #decidir { display: flex; }
  #redactar.esperando #texto { border-color: var(--azul); }
  @keyframes respiro { 50% { opacity: .25; } }
  #texto { display: block; width: 100%; height: calc(64px * var(--esc)); max-height: calc(230px * var(--esc)); resize: none; overflow-y: auto; font: 600 calc(26px * var(--esc))/1.3 var(--sans); color: var(--texto); background: var(--campo); border: 3px solid var(--panel-borde); padding: 12px 16px; outline: none; border-radius: 0; }
  #manija { position: absolute; top: 0; right: -10px; width: 20px; height: 100%; cursor: col-resize; z-index: 30; touch-action: none; }
  #manija::after { content: ''; position: absolute; left: 8px; top: 50%; width: 4px; height: 90px; margin-top: -45px; background: var(--manija); opacity: .0; transition: opacity .15s; }
  #manija:hover::after, #manija.arrastrando::after { opacity: 1; background: var(--acento); }
  #texto:focus { border-color: var(--acento); }
  #texto:disabled { opacity: .5; }
  #texto::placeholder { color: var(--texto-suave); }

  /* Pantallas angostas: el chat pasa abajo, la escuela arriba. */
  @media (max-width: 999px) {
    #escenario { flex-direction: column-reverse; }
    #chat { width: auto; height: 44vh; border-right: 0; border-top: 4px solid var(--panel-borde); }
    #manija { display: none; }
  }

  /* Esquinas "de pixel": recorte escalonado de 4 px */
  .px { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }

  .sala-cartel { position: absolute; background: var(--cartel-fondo); padding: 2px 8px; font-size: calc(14px * var(--u)); font-weight: 700; letter-spacing: 0; text-transform: uppercase; color: var(--cartel-texto); opacity: .9; white-space: nowrap; }

  .pj { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .tag { position: absolute; left: 0; top: calc(10px * var(--u)); transform: translateX(-50%); background: var(--etiqueta-fondo); color: var(--etiqueta-texto); padding: calc(3px * var(--u)) calc(8px * var(--u)); font-size: calc(15px * var(--u)); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .pj.persona .tag { background: var(--acento); color: var(--ink); }   /* la persona que decide, en naranja como en el chat */
  .tag.martina { background: var(--acento); color: var(--ink); }
  /* Globos: sans legible, hasta 4 líneas; el texto completo está en el chat */
  .bub { position: absolute; left: 0; bottom: calc(112px * var(--u)); transform: translateX(-50%); width: max-content; max-width: calc(380px * var(--esc)); background: var(--globo-borde); padding: 4px; opacity: 0; transition: opacity 180ms steps(3); }
  .bub span { display: block; background: var(--globo-fondo); color: var(--globo-texto); padding: 12px 16px; font: 700 calc(25px * var(--esc))/1.3 var(--sans); clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }
  .bub span i { font-style: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .bub.visible { opacity: 1; }
  .bub::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 12px; height: 12px; margin-left: -6px; background: var(--globo-borde); clip-path: polygon(0 0, 100% 0, 100% 40%, 66% 40%, 66% 70%, 33% 70%, 33% 40%, 0 40%); }
  .pj.abajo .bub::after { bottom: auto; top: -10px; transform: scaleY(-1); }

  /* Conmutador de vistas (arriba a la derecha) y controles (aparecen al mover el mouse) */
  /* Fijo a la ventana y por encima del organigrama: ocupa exactamente el mismo lugar en las dos vistas (mismo CSS en organigrama.html) */
  #vistas { position: fixed; right: 14px; top: 10px; z-index: 60; display: flex; background: var(--ink); padding: 4px; gap: 4px; }
  #vistas button { font: 700 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: transparent; color: #f4efe2; border: 0; padding: 8px 14px; cursor: pointer; }
  #vistas button.on { background: var(--acento); color: var(--ink); }
  #vistas button:hover:not(.on) { background: #2c2f48; }
  #vistas kbd { font: inherit; background: rgba(255,255,255,.14); padding: 2px 8px; margin-left: 8px; }
  #barra { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0 auto; width: max-content; max-width: calc(100% - 28px); display: flex; gap: 8px; align-items: center; background: var(--ink); padding: 8px; opacity: 0; transition: opacity 200ms; pointer-events: none; z-index: 20; flex-wrap: wrap; justify-content: center; }
  #barra.visible { opacity: 1; pointer-events: auto; }
  #barra button, #barra select { font: 700 calc(17px * var(--esc)) var(--mono); letter-spacing: .05em; text-transform: uppercase; background: #2c2f48; color: #f4efe2; border: 0; padding: 10px 13px; cursor: pointer; }
  #barra .sep { width: 4px; height: 28px; background: #4a4f78; }
  #barra button:focus-visible, #barra select:focus-visible, #vistas button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  #barra button:hover, #barra select:hover { background: #3c4066; }
  #barra button.on { background: var(--ok); color: var(--ink); }
  #barra button:disabled { opacity: .4; cursor: default; }
  @keyframes parpadeo { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .bub { transition: none; } .f { animation: none; } .f.decision .cuerpo { animation: none; } #decidir::before { animation: none; } #chat-estado.vivo::before, #trabajando.on::before { animation: none; } }
  #org { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 50; display: none; background: var(--fondo-pagina); }
  #org.abierto { display: block; }
</style>
</head>
<body>
<iframe id="org" title="Organigrama"></iframe>
<div id="vistas" class="px"><button id="v-escuela" class="on">Escuela</button><button id="v-org">Organigrama <kbd>o</kbd></button></div>
<div id="escenario">
  <aside id="chat">
    <div id="chat-cab"><span class="canal"><b>#</b>coordinacion</span><span id="chat-estado">Grabación</span></div>
    <div id="msgs"><div class="vacio">Todavía no habló nadie. La escuela está en silencio.</div></div>
    <div id="trabajando"></div>
    <div id="manija" title="Arrastrá para mover el chat ( [ y ] )"></div>
    <form id="redactar" autocomplete="off"><div id="decidir">Esperando tu decisión</div><textarea id="texto" rows="1" disabled placeholder="@Coordinación …" spellcheck="false"></textarea></form>
  </aside>
  <div id="mundo">
    <div id="mapa">
      <canvas id="lienzo"></canvas>
      <div id="capa"></div>
    </div>
    <div id="barra">
      <button id="btn-prev" title="Paso anterior (←)">‹</button>
      <button id="btn-play" title="Play / pausa (espacio)">Pausa</button>
      <button id="btn-next" title="Paso siguiente (→)">›</button>
      <select id="velocidad" title="Velocidad"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <span class="sep"></span>
      <button id="btn-grab" title="Reproducir la corrida grabada (g)">Grabación</button>
      <button id="btn-vivo" title="Conectar al servidor de la escuela (v)">En vivo</button>
      <button id="btn-reiniciar" title="Sesión nueva: borra la corrida actual (r)">Reiniciar</button>
      <button id="btn-guardar" title="Descargar la corrida actual como JSON">Guardar corrida</button>
      <span class="sep"></span>
      <button id="btn-tema" title="Tema claro / oscuro (t)">Claro</button>
    </div>
  </div>
</div>

<script type="module">
import { crearOficina, W, H, CARTELES, MARTINA } from './oficina.js';
import { MODELOS, cara, aplicarColores } from './personajes.js';
import { crearHilo, trozos, bloques, primeraLinea } from './chat.js';
import { completarHerramienta } from './herramientas.js';

const $ = (id) => document.getElementById(id);
const mundo = $('mundo'), mapa = $('mapa');
const params = new URLSearchParams(location.search);
let K = 3;   // píxeles de pantalla por píxel lógico de la escuela (lo calcula escalar())

let CONFIG = { agentes: [], personas: { nombre: 'Dirección', casa: 'direccion' } };
let ofi = null, fichas = null;
let eventos = [], indice = 0, reloj = 0, reproduciendo = false, velocidad = 1, ultimoFrame = 0;
let temporizadores = [], decisionPendiente = false, modoVivo = false, silencioso = false;
const programar = (ms, fn) => { const t = { t: reloj + ms, fn }; temporizadores.push(t); return t; };

// ── Tema ─────────────────────────────────────────────────────────────────────
let tema = document.documentElement.dataset.tema === 'claro' ? 'claro' : 'oscuro';
function aplicarTema(t) {
  tema = t === 'claro' ? 'claro' : 'oscuro';
  document.documentElement.dataset.tema = tema; aplicarColores(tema);
  if (ofi) ofi.tema(tema);
  try { localStorage.setItem('tema', tema); } catch {}
  $('btn-tema').textContent = tema === 'oscuro' ? 'Claro' : 'Oscuro';
  const f = $('org'); if (f.getAttribute('src') && f.contentWindow) f.contentWindow.postMessage({ tipo: 'tema', tema }, '*');
}
aplicarTema(tema);

// ── Chat del canal (columna izquierda) ───────────────────────────────────────
const caraUrl = {};   // la cara de cada personaje (la misma de la escuela) como imagen, para el chat
function urlDeCara(id) { const k = id || 'persona'; if (!caraUrl[k]) caraUrl[k] = cara(ofi.hojas[MODELOS[k]], 4).toDataURL(); return caraUrl[k]; }
const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const agenteDe = (nombre) => { const n = sinTildes(nombre); const a = CONFIG.agentes.find((x) => sinTildes(x.nombre) === n || x.id === n); return a ? a.id : null; };
const hilo = crearHilo();
const VACIO = '<div class="vacio">Todavía no habló nadie. La escuela está en silencio.</div>';
const RIEL = 4;   // mensajes ya leídos que quedan arriba, de a una línea
function chatLimpiar() { hilo.limpiar(); $('msgs').innerHTML = VACIO; }
function cara_(id) { const av = document.createElement('div'); av.className = 'av px'; const im = document.createElement('img'); im.src = urlDeCara(id); im.alt = ''; av.appendChild(im); return av; }
function conMenciones(el, linea) { for (const t of trozos(linea)) { if (t.mencion) { const a = document.createElement('span'); a.className = 'a'; a.textContent = t.texto; el.appendChild(a); } else el.appendChild(document.createTextNode(t.texto)); } return el; }
const colorDe = (id) => `var(--ag-${id || 'persona'})`;   // el color sale de las variables del tema, así cambia sin redibujar
let fijado = null;   // la propuesta queda en foco mientras se espera la decisión, aunque sigan llegando mensajes
function chatDibujar(animar = true) {
  const cont = $('msgs'); const ms = hilo.mensajes;

  const fijo = decisionPendiente && fijado && ms.includes(fijado) ? fijado : null;
  const ultimo = fijo || ms[ms.length - 1];
  cont.classList.toggle('fijado', !!fijo);
  const idDe = (m) => (m.persona ? null : agenteDe(m.autor));
  const riel = document.createElement('div'); riel.id = 'riel';

    const id = idDe(m); const r = document.createElement('div'); r.className = 'r'; r.style.setProperty('--c', colorDe(id));
    const nom = document.createElement('b'); nom.textContent = m.autor || 'Alguien';
    const resumen = document.createElement('span'); resumen.textContent = primeraLinea(m.texto);
    r.append(cara_(id), nom, resumen); riel.appendChild(r);

  const nom = document.createElement('div'); nom.className = 'nom'; nom.textContent = ultimo.autor || 'Alguien';
  if (ultimo.hora) { const h = document.createElement('small'); h.textContent = ultimo.hora; nom.appendChild(h); }
  const cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
  for (const b of bloques(ultimo.texto)) {
    const el = document.createElement('div');
    if (b.tipo === 'item') { el.className = 'it'; const n = document.createElement('i'); n.textContent = b.n + '.'; el.appendChild(n); }
    else el.className = b.tipo === 'detalle' ? 'de' : 'p';

// El último mensaje se muestra completo: se achica la letra (hasta el 53 %) hasta que entre; si aun así no entra,

  let t = 34 * esc; const min = 24 * esc; f.style.setProperty('--t', t + 'px');   // no baja de 24: desde el fondo del auditorio, mejor desplazar que achicar

// Cada personaje tiene una cola de globos: lo que dice se lee de a uno, sin pisarse.
const limpiar = (t) => String(t).replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
function corto(t) {

  if (x.length > 140) { const corte = x.slice(0, 140); const punto = Math.max(corte.lastIndexOf('. '), corte.lastIndexOf('; ')); x = (punto > 70 ? corte.slice(0, punto + 1) : corte.replace(/\s+\S*$/, '')) + '…'; }

let pendientes = [];
const visibles = () => { let n = 0; for (const f of fichas.values()) if (f.actual) n++; return n; };
function decir(f, texto, tipo = 'msg') {

  const item = { texto: tipo === 'msg' ? corto(texto) : limpiar(texto), tipo };
  item.ms = tipo === 'tool' ? 4800 : Math.max(3800, Math.min(10000, 1800 + item.texto.length * 52));
  f.cola = f.cola || [];

}
function intentar(f) {

}
function mostrar(f, item) { f.actual = item; f.hasta = reloj + item.ms; f.textoVisible = true; const e = etiqueta(f); e.sp.textContent = item.texto; e.bub.classList.add('visible'); }

function aplicar(ev) {
  if (ev.tipo === 'persona') {
    // La persona que decide: habla por el chat y su personaje lo dice desde Dirección.
    const p = fichas.get('persona:direccion'); if (p) decir(p, ev.texto);
    chatAgregar({ clave: ev.id, autor: CONFIG.personas.nombre, texto: ev.texto, hora: ev.hora, t: ev.t, persona: true, decision: decisionPendiente });
    esperarDecision(false);
    return;
  }
  const f = fichas.get(ev.quien) || ofi.agregar(ev.quien, { nombre: ev.quien.replace('agente:', 'Agente '), casa: 'pasillo' });
  if (ev.tipo === 'inicio') { f.trabajando = true; return; }
  if (ev.tipo === 'fin') { f.trabajando = false; if (silencioso) ofi.ir(f, f.casa); else programar(2800, () => { if (!f.trabajando) ofi.ir(f, f.casa); }); return; }
  if (ev.tipo === 'herramienta') { const h = completarHerramienta(ev); if (h.lugar) ofi.ir(f, h.lugar); decir(f, h.texto, 'tool'); return; }
  if (ev.tipo === 'piensa') { decir(f, ev.texto, 'tool'); return; }
  if (ev.tipo === 'dice') {
    const destinos = ev.a || [];
    const agentes = destinos.filter(esAgente), personas = destinos.filter(esPersona);
    const esPropuesta = /^\W*propuesta|para decidir|¿aprob|aprobás, editás/i.test(limpiar(ev.texto));
    decir(f, ev.texto);
    chatAgregar({ clave: ev.id, autor: f.nombre, texto: ev.texto, hora: ev.hora, t: ev.t });
    if (personas.length) {
      ofi.ir(f, CONFIG.personas.casa);   // va a presentar al despacho de Dirección
      if (esPropuesta) { fijado = hilo.mensajes[hilo.mensajes.length - 1]; esperarDecision(true); }
    } else if (agentes.length) {
      const hermanos = eventos.filter((e) => e.tipo === 'dice' && e.quien === ev.quien && Math.abs(e.t - ev.t) < 1500);
      const todos = [...new Set(hermanos.flatMap((e) => (e.a || []).filter(esAgente)))];
      if (todos.length > 1) ofi.ir(f, 'pasillo');
      else { const otro = fichas.get(agentes[0]); ofi.ir(f, otro.sala || otro.casa); }
    }
  }
}

  $('capa').querySelectorAll('.pj').forEach((n) => n.remove()); etiquetas.clear();
  fichas = ofi.personajes; pendientes = []; temporizadores = []; indice = 0; reloj = 0;

function posicionar() {
  // Globos: arriba del personaje si hay lugar, si no abajo; si chocan con otro, se corren.
  const puestos = [];
  for (const p of fichas.values()) etiqueta(p);
  const orden = [...etiquetas].sort((a, b) => a[0].y - b[0].y);
  for (const [p, e] of orden) {
    const sentado = p.sentado && !p.moviendo;
    const x = Math.round(p.x) * K, y = (Math.round(p.y) + (sentado ? 3 : 0)) * K;
    e.el.style.transform = `translate(${x}px, ${y}px)`;
    e.el.style.zIndex = String(Math.round(p.y) + 1000);
    if (!e.bub.classList.contains('visible')) continue;
    const w = e.bub.offsetWidth, h = e.bub.offsetHeight;
    const cx0 = Math.max(w / 2 + 8, Math.min(W * K - w / 2 - 8, x));
    const cima = y - 32 * K - 14 * K / 3;                       // borde superior de la cabeza
    // Candidatos en orden: arriba, abajo y, si chocan con otro globo o salen de la pantalla, corridos al costado.
    const arr = cima - h - 10, aba = y + 17 * K;

    puestos.push({ l: cx - w / 2, t, w, h });

function loop(ts) {

function escalar() {
  // La escuela se escala por aspecto al espacio que deja el chat; las letras bajan con la pantalla (--esc) para que entren.
  const esc = Math.max(0.55, Math.min(1.1, Math.min(innerWidth / 1920, innerHeight / 1080)));
  document.documentElement.style.setProperty('--esc', esc.toFixed(3));
  const mw = mundo.clientWidth, mh = mundo.clientHeight;
  K = Math.max(0.5, Math.min(mw / W, mh / H));
  const w = Math.round(W * K), h = Math.round(H * K);
  Object.assign(mapa.style, { width: w + 'px', height: h + 'px', left: Math.round((mw - w) / 2) + 'px', top: Math.round((mh - h) / 2) + 'px' });
  mapa.style.setProperty('--u', (K / 3).toFixed(3));
  if (ofi) ofi.resolucion(Math.max(1, Math.ceil(K * (devicePixelRatio || 1))));   // el lienzo se dibuja en alta resolución y se achica sin deformar el pixel-art
  for (const c of document.querySelectorAll('.sala-cartel')) { c.style.left = (+c.dataset.x) * K + 'px'; c.style.top = (+c.dataset.y) * K + 'px'; }
  const m = document.getElementById('martina'); if (m && MARTINA) { m.style.left = MARTINA.x * K + 'px'; m.style.top = (MARTINA.y + 4) * K + 'px'; }
}
addEventListener('resize', () => { escalar(); chatDibujar(false); }); escalar(); chatDibujar(false);
if (document.fonts) document.fonts.ready.then(() => chatDibujar(false));   // con las fuentes cargadas el texto mide distinto

// ── En vivo: el servidor de la escuela (servidor/), por SSE ──────────────────
// GET /api/eventos manda `estado`, `snapshot` (la corrida hasta ahora) y después `eventos` (un array por frame).
let es = null, deseaVivo = false, huboConexion = false;
function desconectar() { deseaVivo = false; enviarMensaje = null; if (es) { const s = es; es = null; s.close(); } textoEstado = ''; }

function enviarAlServidor(texto) {
  fetch('/api/mensaje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto }) })
    .then(async (r) => { if (!r.ok) { let m = 'No se pudo enviar.'; try { m = (await r.json()).error || m; } catch {} aviso(m); if (!cajaTexto.value) { cajaTexto.value = texto; ajustarCaja(); } } })   // rechazado (p. ej. @mención inexistente): el texto vuelve a la caja
    .catch(() => aviso('No se pudo enviar. ¿Está el servidor?'));
  return true;
}
// Repone de golpe lo que ya pasó: posiciones y chat, sin globos ni caminatas.
function cargarSnapshot(lista) {
  reiniciar(); eventos = lista.map(completarHerramienta).sort((a, b) => a.t - b.t);
  silencioso = true; ofi.instantaneo = true;
  for (const ev of eventos) { reloj = ev.t; aplicar(ev); }
  ofi.instantaneo = false; silencioso = false; indice = eventos.length;
  chatDibujar(false);
}
function recibir(lista) {
  const nuevos = (Array.isArray(lista) ? lista : [lista]).map(completarHerramienta);
  for (const n of nuevos) eventos.push(n);
  eventos.sort((x, y) => x.t - y.t);
  for (const n of nuevos.sort((x, y) => x.t - y.t)) aplicar(n);
  indice = eventos.length;
}
function conectar() {
  desconectar(); deseaVivo = true;
  setPlay(false); eventos = []; reiniciar(); modoVivo = true; reloj = 0;
  textoEstado = 'Conectando…'; actualizarEstado();
  $('btn-play').textContent = 'En vivo';
  const s = es = new EventSource('/api/eventos');
  let abierto = false;
  s.addEventListener('estado', (e) => {
    let d = {}; try { d = JSON.parse(e.data); } catch {}
    abierto = huboConexion = true; textoEstado = '';
    if (d.persona && !params.get('nombre')) nombrarPersona(d.persona);   // el nombre lo manda el servidor (ESCUELA_DIRECTOR), salvo ?nombre=
    enviarMensaje = enviarAlServidor; actualizarEstado();
  });
  s.addEventListener('snapshot', (e) => { try { cargarSnapshot(JSON.parse(e.data).eventos || []); } catch (err) { console.error(err); } });
  s.addEventListener('eventos', (e) => { try { recibir(JSON.parse(e.data)); } catch (err) { console.error(err); } });
  s.addEventListener('reinicio', () => { eventos = []; reiniciar(); aviso('Sesión nueva.'); });
  s.onerror = () => {
    if (es !== s) return;
    if (!abierto && !huboConexion) { s.close(); es = null; falla('No hay servidor: se reproduce la grabación.'); return; }
    textoEstado = 'Reconectando…'; enviarMensaje = null; actualizarEstado();   // EventSource reintenta solo; al volver llega `estado` de nuevo
  };
}
// Si nunca se pudo conectar, la vista cae sola a la corrida grabada (plan B).
function falla(motivo) {
  console.warn('En vivo:', motivo);
  desconectar(); cargarGrabacion(); aviso(motivo);
}

async function cargarGrabacion() {
  const q = params.get('corrida') || 'corridas/2026-10-12-primer-anio-en-riesgo.eventos.json';
  const data = await (await fetch(q)).json();
  modoVivo = false; textoEstado = ''; cargarEventos(data.eventos);
  const paso = Number(params.get('paso'));
  if (paso > 0) irAlPaso(paso - 1); else if (params.get('auto') !== '0') setPlay(true);
}

// ── Arranque ─────────────────────────────────────────────────────────────────
// Por defecto se conecta al servidor de la escuela (./escenario). Sin servidor, o con ?grabacion=1,
// ?corrida=… o ?paso=N, arranca con la corrida grabada.
try {
  CONFIG = await (await fetch('agentes.json')).json();
  if (params.get('nombre')) CONFIG.personas.nombre = params.get('nombre').trim().slice(0, 40);   // ?nombre=Greyla: quién es la persona que decide
  ofi = await crearOficina($('lienzo')); ofi.tema(tema);
  for (const t of CARTELES) { const c = document.createElement('div'); c.className = 'sala-cartel'; c.textContent = t.texto; c.dataset.x = t.x; c.dataset.y = t.y; $('capa').appendChild(c); }
  const m = document.createElement('div'); m.id = 'martina'; m.className = 'tag martina px'; m.textContent = 'Martina'; $('capa').appendChild(m);
  escalar();
  reiniciar();
  const forzarGrabacion = params.get('grabacion') === '1' || params.has('corrida') || params.has('paso');
  if (forzarGrabacion) await cargarGrabacion(); else conectar();
} catch (e) { console.error(e); if (!ofi) document.body.insertAdjacentText('afterbegin', 'Abrí esta página con "./escenario" (ver README).'); }
requestAnimationFrame(loop);
</script>
