<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuela Futura</title>
<script>
  // El tema se aplica antes del primer cuadro para no ver un destello del otro. ?tema= manda; si no, lo guardado; si no, oscuro.
  (function () { try { var q = new URLSearchParams(location.search).get('tema'); var t = q || localStorage.getItem('tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {} })();
</script>
<style>
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Regular.ttf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Bold.ttf"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Regular.otf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Medium.otf"); font-weight: 500 600; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Bold.otf"); font-weight: 700; font-display: block; }

  /* Colores por función, no por tono. El oscuro es el tema original; el claro usa el papel crema del brand kit. */
  :root { color-scheme: dark;
    --fondo-pagina: #0b0b12; --panel: #10101b; --panel-borde: #2c2f48; --texto: #f4efe2; --texto-suave: #9a9eba; --texto-tenue: #8f93b0; --texto-apagado: #6b6f8a; --hora: #a7abc9;
    --acento: #ff7a3d; --ok: #5fae6a; --azul: #3e6be8; --sobre-azul: #f4efe2; --mencion: #ffb48a; --rechazo: #d9604c; --medio: #e0b84a;
    --campo: #1b1b2b; --manija: #4a4f78; --boton: #2c2f48; --boton-hover: #3c4066; --boton-texto: #f4efe2;
    --globo-fondo: #f4efe2; --globo-texto: #1a1a2e; --globo-borde: #1a1a2e; --etiqueta-fondo: #1a1a2e; --etiqueta-texto: #f4efe2; --cartel-fondo: #1a1a2e; --cartel-texto: #dfe2f5;
    --ink: #1a1a2e;
    --esc: 1;   /* escala tipográfica: 1 en 1920×1080, baja en pantallas chicas (la pone escalar()) */
    --mono: "Silkscreen", "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Plain", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  :root[data-tema="claro"] { color-scheme: light;
    --fondo-pagina: #e9e2d3; --panel: #f9f4ea; --panel-borde: #d6cdb9; --texto: #121212; --texto-suave: #5c5f73; --texto-tenue: #585c72; --texto-apagado: #6f738a; --hora: #5c5f73;
    --acento: #c2410c; --ok: #2f7a3b; --azul: #2f54c8; --sobre-azul: #f9f4ea; --mencion: #b4431a; --rechazo: #c2452f; --medio: #c9a02e;
    --campo: #ffffff; --manija: #b9af9a; --boton: #e6dfcd; --boton-hover: #d8cfb9; --boton-texto: #121212;
    --globo-fondo: #f4efe2; --globo-texto: #1a1a2e; --globo-borde: #1a1a2e; --etiqueta-fondo: #1a1a2e; --etiqueta-texto: #f4efe2; --cartel-fondo: #1a1a2e; --cartel-texto: #f4efe2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo-pagina); overflow: hidden; font-family: var(--mono); cursor: default; }

  /* Layout fluido: el chat es una columna real; la escuela ocupa el resto y se escala por aspecto. */
  #escenario { position: fixed; inset: 0; display: flex; background: var(--fondo-pagina); }
  #mundo { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--fondo-pagina); }
  #mapa { position: absolute; left: 0; top: 0; --u: 1.25; }
  canvas#lienzo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: auto; }
  #capa { position: absolute; inset: 0; pointer-events: none; }

  /* Chat del canal */
  #chat { position: relative; flex: none; width: clamp(360px, var(--cw, 31vw), 55vw); display: flex; flex-direction: column; background: var(--panel); border-right: 4px solid var(--panel-borde); color: var(--texto); }
  #chat { container-type: inline-size; font-family: var(--sans); }
  #chat-cab .canal { font-family: var(--mono); }
  #escenario.decidiendo #chat { width: clamp(360px, max(var(--cw, 31vw), 48vw), 55vw); }
  /* Chat colapsado: la escuela ocupa todo; la pestaña del borde lo vuelve a abrir (azul si hay una decisión esperando) */
  #escenario.sin-chat #chat, #escenario.sin-chat #manija { display: none; }
  #pestana { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 60; display: none; writing-mode: vertical-rl; transform-origin: center; padding: 14px 8px; background: var(--ink); color: #f4efe2; border: 0; font: 700 16px var(--sans); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; opacity: .55; transition: opacity .15s; }
  #escenario.sin-chat ~ #pestana { display: block; }
  #pestana:hover, #pestana.espera { opacity: 1; }
  #pestana.espera { background: var(--azul); color: var(--sobre-azul); animation: parpadeo 1.2s steps(2) infinite; }
  #pestana kbd { font: inherit; opacity: .6; margin-top: 8px; }   /* mientras hay una propuesta sin responder, la tarjeta de decisión toma la escena */
  @container (max-width: 560px) { #chat-cab { font-size: calc(24px * var(--esc)); padding: calc(18px * var(--esc)) calc(20px * var(--esc)); gap: 6px 12px; flex-wrap: wrap; letter-spacing: 0; } #chat-cab .canal { min-width: 0; white-space: nowrap; } .r { display: grid; grid-template-columns: calc(40px * var(--esc)) minmax(0, 1fr); column-gap: 12px; row-gap: 0; } .r .av { grid-row: 1 / 3; } .r b { font-size: calc(17px * var(--esc)); } #riel .r:nth-last-child(n+4) { display: none; } #chat-estado { white-space: nowrap; font-size: calc(16px * var(--esc)); } #msgs, #trabajando { padding-left: calc(20px * var(--esc)); padding-right: calc(20px * var(--esc)); } #redactar { padding-left: calc(20px * var(--esc)); padding-right: calc(20px * var(--esc)); } #texto { font-size: calc(24px * var(--esc)); text-overflow: ellipsis; } }
  #chat-cab { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(22px * var(--esc)) calc(28px * var(--esc)); border-bottom: 4px solid var(--panel-borde); font-weight: 700; font-size: calc(24px * var(--esc)); letter-spacing: 0; }
  #chat-cab .canal { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-cab .canal b { color: var(--acento); }
  #chat-estado { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 10px; font-size: calc(16px * var(--esc)); letter-spacing: .06em; text-transform: uppercase; color: var(--texto-tenue); }
  #chat-estado::before { content: ''; width: 12px; height: 12px; background: var(--texto-apagado); }
  #chat-estado.vivo { color: var(--ok); } #chat-estado.vivo::before { background: var(--ok); animation: parpadeo 1.2s steps(2) infinite; }
  /* La franja del objetivo: una línea con lo que pidió la persona, su estado, y una sola línea viva con lo que pasa ahora */
  #objetivo { flex: none; padding: calc(12px * var(--esc)) calc(28px * var(--esc)); border-bottom: 4px solid var(--panel-borde); display: flex; flex-direction: column; gap: calc(6px * var(--esc)); }
  #objetivo .cab { display: flex; align-items: center; gap: 12px; min-width: 0; }
  #objetivo .rot { flex: none; font: 700 calc(15px * var(--esc)) var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-tenue); }
  #objetivo .txt { flex: 1; min-width: 0; font: 700 calc(21px * var(--esc))/1.25 var(--sans); color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #objetivo.vacio .txt { white-space: normal; font-weight: 600; color: var(--texto-suave); }
  #objetivo .badge { flex: none; display: inline-flex; align-items: center; gap: 8px; font: 700 calc(15px * var(--esc)) var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; background: var(--panel-borde); color: var(--texto); white-space: nowrap; }
  #objetivo .badge.espera { background: var(--azul); color: var(--sobre-azul); } #objetivo .badge.ok { background: var(--ok); color: var(--ink); }
  #objetivo .badge.curso::before, #objetivo .badge.espera::before { content: ''; width: 10px; height: 10px; background: currentColor; animation: parpadeo 1.2s steps(2) infinite; }
  #objetivo .viva { display: flex; align-items: center; gap: 10px; min-width: 0; font: 600 calc(19px * var(--esc))/1.3 var(--sans); color: var(--texto-suave); }
  #objetivo .viva::before { content: ''; flex: none; width: 12px; height: 12px; background: var(--panel-borde); }
  #objetivo .viva .lin { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #objetivo .viva.on { color: var(--texto); } #objetivo .viva.on::before { background: var(--acento); animation: parpadeo .9s steps(2) infinite; }
  #objetivo .viva.on .lin { animation: brillo 1.6s ease-in-out infinite; }
  @keyframes brillo { 50% { opacity: .55; } }
  #objetivo .viva.espera { color: var(--sobre-azul); background: var(--azul); padding: 6px 12px; font-weight: 700; } #objetivo .viva.espera::before { background: var(--sobre-azul); animation: parpadeo 1.2s steps(2) infinite; }
  #objetivo .viva.ok { color: var(--texto); } #objetivo .viva.ok::before { background: var(--ok); clip-path: polygon(0 55%, 15% 40%, 40% 65%, 85% 10%, 100% 25%, 40% 95%); width: 14px; height: 14px; }
  #objetivo .accion { flex: none; font: 700 calc(15px * var(--esc)) var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 7px 11px; background: var(--acento); color: var(--ink); border: 0; cursor: pointer; }
  #objetivo .accion:disabled { opacity: .45; cursor: default; }
  /* El cierre, al final del stream: objetivo cumplido y el plan de acción que dejó la decisión (lo marca la persona) */
  .fin { border: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); padding: calc(12px * var(--esc)) calc(16px * var(--esc)); display: flex; flex-direction: column; gap: calc(8px * var(--esc)); }
  .fin .cab { display: flex; align-items: center; gap: 10px; font: 700 calc(20px * var(--esc)) var(--sans); color: var(--texto); }
  .fin .cab::before { content: ''; flex: none; width: 16px; height: 16px; background: var(--ok); clip-path: polygon(0 55%, 15% 40%, 40% 65%, 85% 10%, 100% 25%, 40% 95%); }
  .fin .cab small { font-weight: 600; color: var(--texto-suave); font-size: calc(17px * var(--esc)); margin-left: auto; }
  .fin .plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(4px * var(--esc)); }
  .fin .plan .fila { display: flex; align-items: center; gap: 10px; font: 600 calc(19px * var(--esc))/1.3 var(--sans); color: var(--texto); }
  .fin .plan .fila .ok { flex: none; width: calc(24px * var(--esc)); height: calc(24px * var(--esc)); border: 2px solid var(--texto-suave); background: transparent; color: var(--ink); font: 700 calc(16px * var(--esc)) var(--sans); cursor: pointer; display: grid; place-items: center; }
  .fin .plan .fila.hecha .ok { background: var(--ok); border-color: var(--ok); }
  .fin .plan .fila .que { flex: none; } .fin .plan .fila .quien { flex: 1; min-width: 0; color: var(--texto-suave); }
  .fin .plan .fila .est { margin-left: auto; font: 700 calc(13px * var(--esc)) var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; background: var(--panel-borde); color: var(--texto-suave); }
  .fin .plan .fila.hecha { color: var(--texto-suave); } .fin .plan .fila.hecha .que { text-decoration: line-through; } .fin .plan .fila.hecha .est { background: var(--ok); color: var(--ink); }
  .fin .plan .fila.descartada { opacity: .5; } .fin .plan .fila.descartada .que { text-decoration: line-through; }
  .fin .nota { font: 600 calc(16px * var(--esc))/1.3 var(--sans); color: var(--texto-suave); }
  #trabajando:empty { display: none; }
  #msgs { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #msgs .vacio { color: var(--texto-suave); font: 600 calc(24px * var(--esc))/1.4 var(--sans); text-align: center; margin: auto calc(28px * var(--esc)); }
  /* El stream: todos los mensajes, en orden, con desplazamiento; el último se ve más grande */
  #flujo { flex: 1; min-height: 0; overflow-y: auto; padding: calc(18px * var(--esc)) calc(28px * var(--esc)) calc(14px * var(--esc)); display: flex; flex-direction: column; gap: calc(16px * var(--esc)); scrollbar-width: thin; }
  #nuevo { position: absolute; right: calc(28px * var(--esc)); bottom: calc(14px * var(--esc)); display: none; padding: 8px 12px; background: var(--acento); color: var(--ink); border: 0; font: 700 calc(16px * var(--esc)) var(--sans); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  #nuevo.visible { display: block; }
  .f { --t: calc(25px * var(--esc)); scroll-margin-top: calc(14px * var(--esc)); display: grid; grid-template-columns: calc(44px * var(--esc)) minmax(0, 1fr); column-gap: calc(14px * var(--esc)); row-gap: 4px; }
  .f.nuevo { animation: entra .4s steps(6) both; }
  .f .av { grid-row: 1 / 3; width: calc(44px * var(--esc)); height: calc(44px * var(--esc)); background: var(--c); overflow: hidden; align-self: start; }
  .f .av img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .f .nom { font-weight: 700; font-size: calc(18px * var(--esc)); letter-spacing: .05em; text-transform: uppercase; color: var(--c); align-self: end; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .f .nom small { font-size: calc(15px * var(--esc)); color: var(--hora); letter-spacing: .04em; }
  .f .nom .chip { font-size: calc(13px * var(--esc)); letter-spacing: .05em; padding: 2px 8px; background: var(--acento); color: var(--ink); }
  .f .cuerpo { font: 600 var(--t)/1.36 var(--sans); color: var(--texto); overflow-wrap: anywhere; }
  .f .cuerpo p { margin: 0 0 .4em; } .f .cuerpo > :last-child { margin-bottom: 0; }
  .f .cuerpo .it { margin: .7em 0 .1em; font-weight: 700; }
  .f .cuerpo .it i { font-style: normal; color: var(--c); margin-right: .45em; }
  .f .cuerpo .de { margin: 0 0 .1em; padding-left: 1.35em; color: var(--texto-suave); font-weight: 600; }
  .f .a { color: var(--mencion); }
  .f .nom .para { font-size: calc(15px * var(--esc)); color: var(--texto-suave); letter-spacing: .04em; text-transform: none; font-weight: 600; }
  .f .nom .para b { color: var(--mencion); font-weight: 700; }
  /* Fichas: una fila por estudiante, con el nombre en rótulo y el riesgo como badge; rótulos: "Traducción", "Pendiente" */
  .f .cuerpo .fi, .f .cuerpo .ro { margin: 0 0 .55em; }
  .f .cuerpo .fi .enc { display: flex; align-items: center; gap: .5em; flex-wrap: wrap; margin-bottom: .12em; }
  .f .cuerpo .fi .enc b { font: 700 calc(var(--t) * .72) var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
  .f .cuerpo .ro .enc { display: inline-block; font: 700 calc(var(--t) * .5) var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--texto); background: var(--panel-borde); padding: 3px 9px; margin: 0 .5em .2em 0; vertical-align: middle; }
  .riesgo { display: inline-block; font: 700 calc(var(--t) * .5) var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; color: var(--ink); vertical-align: middle; }
  .riesgo.alto { background: var(--rechazo); } .riesgo.medio { background: var(--medio); } .riesgo.bajo { background: var(--ok); }
  /* Tarjeta de decisión: la propuesta como tarjeta de aprobación, caso por caso */
  .tarjeta { border: 3px solid var(--azul); background: color-mix(in srgb, var(--azul) 9%, transparent); padding: calc(12px * var(--esc)) calc(16px * var(--esc)); display: flex; flex-direction: column; gap: calc(10px * var(--esc)); font-size: calc(var(--t) * .88); line-height: 1.3; margin-top: .2em; }
  .tarjeta .cab { display: flex; align-items: center; gap: 12px; }
  .tarjeta .cab .ico { flex: none; width: calc(28px * var(--esc)); height: calc(28px * var(--esc)); background: var(--azul); color: var(--sobre-azul); display: grid; place-items: center; font: 700 calc(18px * var(--esc)) var(--sans); }
  .tarjeta .cab h3 { flex: 1; min-width: 0; margin: 0; font: 700 calc(var(--t) * .7) var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--texto); }
  .tarjeta .estado { flex: none; font: 700 calc(16px * var(--esc)) var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; background: var(--azul); color: var(--sobre-azul); }
  .tarjeta .estado.ok { background: var(--ok); color: var(--ink); } .tarjeta .estado.gris { background: var(--panel-borde); color: var(--texto); }
  .tarjeta .desc { color: var(--texto-suave); font-weight: 600; }
  .caso { border-top: 2px solid var(--panel-borde); padding-top: calc(9px * var(--esc)); display: flex; flex-direction: column; gap: calc(6px * var(--esc)); }
  .caso .enc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .caso .enc .acciones { margin-left: auto; }
  .caso .enc .n { font: 700 calc(var(--t) * .7) var(--sans); color: var(--azul); }
  .caso .enc .nombre { font-weight: 700; color: var(--texto); }
  .caso .txt { font-weight: 600; color: var(--texto); }
  .caso .evid { font-weight: 600; color: var(--texto-suave); font-size: calc(var(--t) * .78); }
  .caso .evid .enc, .caso .props { display: inline-block; font: 700 calc(var(--t) * .5) var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--texto); background: var(--panel-borde); padding: 3px 9px; margin: 0 .5em .2em 0; vertical-align: middle; }
  .caso .props { display: block; width: max-content; margin-top: calc(4px * var(--esc)); }
  .acc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: calc(6px * var(--esc)) 0; border-top: 1px solid var(--panel-borde); }
  .acc .que { flex: 1 1 220px; min-width: 0; font-weight: 700; color: var(--texto); }
  .acc .que .quien { font-weight: 600; color: var(--texto-suave); margin-left: .4em; }
  .acc .acciones { margin-left: auto; }
  .acc .acciones button.on.si { background: var(--ok); border-color: var(--ok); color: var(--ink); }
  .acc .acciones button.on.yo { background: var(--acento); border-color: var(--acento); color: var(--ink); }
  .acc .acciones button.on.no { background: var(--rechazo); border-color: var(--rechazo); color: var(--ink); }
  .caso.con-acciones .nota { display: block; }
  .caso .acciones { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .caso .acciones button { font: 700 calc(16px * var(--esc)) var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 6px 10px; border: 2px solid var(--panel-borde); background: transparent; color: var(--texto); cursor: pointer; }
  .caso .acciones button:hover:not(:disabled) { border-color: var(--texto-suave); }
  .caso .acciones button:disabled { opacity: .45; cursor: default; }
  .caso .acciones button.on.aprobado { background: var(--ok); border-color: var(--ok); color: var(--ink); }
  .caso .acciones button.on.editado { background: var(--azul); border-color: var(--azul); color: var(--sobre-azul); }
  .caso .acciones button.on.rechazado { background: var(--rechazo); border-color: var(--rechazo); color: var(--ink); }
  .caso .nota { display: none; width: 100%; font: 600 calc(var(--t) * .72)/1.3 var(--sans); background: var(--campo); color: var(--texto); border: 2px solid var(--panel-borde); padding: 8px 10px; outline: none; border-radius: 0; }
  .caso .nota:focus { border-color: var(--azul); }
  .caso.editado .nota, .caso.rechazado .nota { display: block; }
  .tarjeta .pie { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 2px solid var(--panel-borde); padding-top: calc(12px * var(--esc)); }
  .tarjeta .pie .pendiente { flex: 1 1 100%; color: var(--texto-suave); font-weight: 600; font-size: calc(var(--t) * .7); }
  .tarjeta .pie .pendiente .enc { display: inline-block; font: 700 calc(var(--t) * .46) var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--texto); background: var(--panel-borde); padding: 3px 9px; margin-right: .5em; vertical-align: middle; }
  .tarjeta .pie button { font: 700 calc(17px * var(--esc)) var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; border: 2px solid transparent; }
  .tarjeta .pie .enviar { background: var(--azul); border-color: var(--azul); color: var(--sobre-azul); }
  .tarjeta .pie .enviar:disabled { opacity: .45; cursor: default; }
  .tarjeta .pie .mano { background: transparent; border-color: var(--panel-borde); color: var(--texto-suave); }
  .tarjeta .pie .mano:hover { color: var(--texto); border-color: var(--texto-suave); }
  .tarjeta .pie .resultado { flex: 1; color: var(--texto-suave); font-weight: 600; }
  .tarjeta .pie .pregunta { flex: 1 1 100%; color: var(--texto); font-weight: 700; }
  .f.persona .cuerpo { padding: 10px 14px; background: color-mix(in srgb, var(--c) 12%, transparent); }

<script type="module">
import { crearOficina, W, H, CARTELES, MARTINA, DECISION } from './oficina.js';

const $ = (id) => document.getElementById(id);
const mundo = $('mundo'), mapa = $('mapa');
const params = new URLSearchParams(location.search);
let K = 3;   // píxeles de pantalla por píxel lógico de la escuela (lo calcula escalar())

let CONFIG = { agentes: [], personas: { nombre: 'Dirección', casa: 'direccion' } };
let ofi = null, fichas = null;
let eventos = [], indice = 0, reloj = 0, reproduciendo = false, velocidad = 1, ultimoFrame = 0;
let temporizadores = [], decisionPendiente = false, modoVivo = false, silencioso = false;
const programar = (ms, fn) => { const t = { t: reloj + ms, fn }; temporizadores.push(t); return t; };

// ── Tema ─────────────────────────────────────────────────────────────────────
let tema = document.documentElement.dataset.tema === 'claro' ? 'claro' : 'oscuro';
function aplicarTema(t) {
  tema = t === 'claro' ? 'claro' : 'oscuro';
  document.documentElement.dataset.tema = tema; aplicarColores(tema);
  if (ofi) ofi.tema(tema);
  try { localStorage.setItem('tema', tema); } catch {}
  $('btn-tema').textContent = tema === 'oscuro' ? 'Claro' : 'Oscuro';
  for (const id of ['org', 'tab']) { const f = $(id); if (f.getAttribute('src') && f.contentWindow) f.contentWindow.postMessage({ tipo: 'tema', tema }, '*'); }
}
aplicarTema(tema);

// ── Chat del canal (columna izquierda) ───────────────────────────────────────
const caraUrl = {};   // la cara de cada personaje (la misma de la escuela) como imagen, para el chat
function urlDeCara(id) { const k = id || 'persona'; if (!caraUrl[k]) caraUrl[k] = cara(ofi.hojas[MODELOS[k]], 4).toDataURL(); return caraUrl[k]; }
const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const agenteDe = (nombre) => { const n = sinTildes(nombre); const a = CONFIG.agentes.find((x) => sinTildes(x.nombre) === n || x.id === n); return a ? a.id : null; };
const hilo = crearHilo();
const el_ = (tag, clase, texto) => { const e = document.createElement(tag); if (clase) e.className = clase; if (texto != null) e.textContent = texto; return e; };
const VACIO = '<div class="vacio">Todavía no habló nadie. La escuela está en silencio.</div>';
function chatLimpiar() { hilo.limpiar(); vistos.clear(); enfocadas.clear(); $('msgs').innerHTML = VACIO; }
function cara_(id) { const av = document.createElement('div'); av.className = 'av px'; const im = document.createElement('img'); im.src = urlDeCara(id); im.alt = ''; av.appendChild(im); return av; }
function conMenciones(el, linea) { for (const t of trozos(linea)) { if (t.mencion) { const a = document.createElement('span'); a.className = 'a'; a.textContent = t.texto; el.appendChild(a); } else el.appendChild(document.createTextNode(t.texto)); } return el; }
const colorDe = (id) => `var(--ag-${id || 'persona'})`;   // el color sale de las variables del tema, así cambia sin redibujar
let fijado = null;   // la propuesta queda en foco mientras se espera la decisión, aunque sigan llegando mensajes

// ── El objetivo: qué pidió la persona y en qué paso está (arriba del transcript, fijo) ───────────────────
const seg = crearSeguimiento({ agenteDe, esPropuesta, accionesDe: (t) => propuesta(t).casos.flatMap((c) => c.acciones || []), nombrePersona: () => (CONFIG && CONFIG.personas && CONFIG.personas.nombre) || 'Dirección' });
const nombreDe = (id) => (CONFIG.agentes.find((a) => a.id === id) || {}).nombre || id;
function dibujarObjetivo() {
  const el = $('objetivo'); const p = seg.actual; el.replaceChildren();
  const cab = el_('div', 'cab');
  if (!p) {
    el.className = 'vacio';
    cab.appendChild(el_('span', 'rot', 'Objetivo'));
    cab.appendChild(el_('div', 'txt', 'Dale un objetivo a Coordinación: reparte el trabajo y vuelve con una propuesta.'));
    const b = el_('button', 'accion px', 'Usar el del guion'); b.type = 'button'; b.disabled = !enviarMensaje || !ATAJOS.length;
    b.onclick = () => { if (!ATAJOS.length) return; cajaTexto.value = ATAJOS[0].texto; ajustarCaja(); $('para').value = ''; cajaTexto.focus(); };
    cab.appendChild(b); el.appendChild(cab); return;
  }
  el.className = p.estado === 'cerrado' ? 'cumplido' : p.estado === 'propuesta' ? 'esperando' : 'curso';
  const { badge, items, plan } = actividadDe(p, { nombreDe, ahora: reloj });
  cab.appendChild(el_('span', 'rot', p.objetivo ? 'Objetivo' : 'Pedido'));
  const txt = conMenciones(el_('div', 'txt'), p.texto); txt.title = p.texto; cab.appendChild(txt);
  if (badge) cab.appendChild(el_('span', 'badge px ' + badge.tono, badge.texto));
  el.appendChild(cab);
  // Una sola línea viva: qué está pasando ahora mismo
  const vivos = items.filter((x) => x.estado === 'on'), espera = items.find((x) => x.estado === 'espera');
  let viva;
  if (p.estado === 'cerrado') {
    const acciones = tablero.subtareas.filter((x) => x.estado !== 'descartada' && x.t >= p.t0).length;
    viva = { clase: 'ok', texto: p.objetivo ? (acciones ? `Cumplido. ${acciones === 1 ? '1 acción' : acciones + ' acciones'} en el Tablero, en manos de personas.` : 'Cumplido. Podés dar otro objetivo o preguntarle a un agente por qué.') : 'Respondido.', tablero: acciones > 0 };
  } else if (espera) viva = { clase: 'espera', texto: 'Esperando tu decisión: aprobá, reservate o rechazá cada acción.' };
  else if (vivos.length) viva = { clase: 'on', texto: vivos.slice(0, 2).map((x) => x.texto).join('  ·  ') + (vivos.length > 2 ? `  ·  +${vivos.length - 2}` : '') };
  else if (p.estado === 'decidido') viva = { clase: 'on', texto: 'Coordinación cierra…' };
  else { const faltan = Object.entries(p.agentes).filter(([, e]) => e !== 'respondio').map(([id]) => nombreDe(id)); viva = { clase: '', texto: faltan.length ? 'Esperando a ' + faltan.join(', ') : 'En curso' }; }
  const v = el_('div', 'viva ' + viva.clase); v.appendChild(el_('span', 'lin', viva.texto)); el.appendChild(v);
  if (viva.tablero) { v.style.cursor = 'pointer'; v.title = 'Abrir el Tablero (b)'; v.onclick = () => vista('tab'); }
}
const vistos = new Set();   // mensajes ya dibujados: solo los nuevos entran con animación
const enfocadas = new Set();   // propuestas a las que ya se desplazó el stream (una vez por propuesta)
function chatDibujar(animar = true) {
  const cont = $('msgs'); const ms = hilo.mensajes;
  const viejo = $('flujo');
  const pegado = !viejo || viejo.scrollTop + viejo.clientHeight >= viejo.scrollHeight - 80;
  const scrollAntes = viejo ? viejo.scrollTop : 0;
  if (!ms.length) { cont.innerHTML = VACIO; vistos.clear(); return; }
  const idDe = (m) => (m.persona ? null : agenteDe(m.autor));
  const entradas = ms.map((m) => ({ t: typeof m.t === 'number' ? m.t : 0, tipo: 'm', m }));
  entradas.sort((a, b) => a.t - b.t);

  for (const t of CARTELES) { const c = document.createElement('div'); c.className = 'sala-cartel'; c.textContent = t.texto; c.dataset.x = t.x; c.dataset.y = t.y; $('capa').appendChild(c); }
  const m = document.createElement('div'); m.id = 'martina'; m.className = 'tag martina px'; m.textContent = 'Martina'; $('capa').appendChild(m);
  const cd = document.createElement('div'); cd.id = 'cartel-decision'; cd.className = 'px'; cd.textContent = 'Esperando tu decisión'; $('capa').appendChild(cd);
  { let oculto = params.get('chat') === '0'; try { if (!params.has('chat') && localStorage.getItem('chatOculto') === '1') oculto = true; } catch {} chatVisible(!oculto); }
  escalar();
  reiniciar();
  const forzarGrabacion = params.get('grabacion') === '1' || params.has('corrida') || params.has('paso');
  if (forzarGrabacion) await cargarGrabacion(); else conectar();
} catch (e) { console.error(e); if (!ofi) document.body.insertAdjacentText('afterbegin', 'Abrí esta página con "./escenario" (ver README).'); }
requestAnimationFrame(loop);
</script>
