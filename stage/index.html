<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuela Futura</title>
<style>
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Regular.ttf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-Bold.ttf"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Regular.otf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Medium.otf"); font-weight: 500 600; font-display: block; }
  @font-face { font-family: "Plain"; src: url("assets/Plain-Bold.otf"); font-weight: 700; font-display: block; }
  :root { --ink: #1a1a2e; --papel: #f4efe2; --naranja: #ff7a3d; --azul: #3e6be8; --gris: #9a9eba; --gris-bajo: #8f93b0; --verde: #5fae6a; --fuera: #0b0b12; --panel: #10101b; --linea: #2c2f48;
    --mono: "Silkscreen", "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Plain", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fuera); overflow: hidden; font-family: var(--mono); cursor: default; }

  /* Escenario 16:9 de 1920×1080: se escala entero para llenar la pantalla. A la izquierda el chat, a la derecha la escuela. */
  #escenario { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; display: flex; align-items: center; background: var(--fuera); }
  #mundo { position: relative; margin: auto; width: 1200px; height: 1080px; flex: none; overflow: hidden; background: var(--fuera); --u: 1.25; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: auto; }
  #capa { position: absolute; inset: 0; pointer-events: none; }

  /* Chat del canal */
  #chat { position: relative; width: min(var(--cw, 720px), var(--cwmax, 720px)); align-self: stretch; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 4px solid var(--linea); color: var(--papel); }
  #chat { container-type: inline-size; }
  @container (max-width: 560px) { #chat-cab { font-size: 24px; padding: 18px 20px; gap: 6px 12px; flex-wrap: wrap; letter-spacing: 0; } #chat-cab .canal { min-width: 0; white-space: nowrap; } .r { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; row-gap: 0; } .r .av { grid-row: 1 / 3; } .r b { font-size: 17px; } #riel .r:nth-last-child(n+4) { display: none; } #chat-estado { white-space: nowrap; font-size: 16px; } #msgs, #trabajando { padding-left: 20px; padding-right: 20px; } #redactar { padding-left: 20px; padding-right: 20px; } #texto { font-size: 24px; text-overflow: ellipsis; } }
  #chat-cab { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 28px; border-bottom: 4px solid var(--linea); font-weight: 700; font-size: 24px; letter-spacing: 0; }
  #chat-cab .canal { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-cab .canal b { color: var(--naranja); }
  #chat-estado { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 10px; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--gris-bajo); }
  #chat-estado::before { content: ''; width: 12px; height: 12px; background: #6b6f8a; }
  #chat-estado.vivo { color: var(--verde); } #chat-estado.vivo::before { background: var(--verde); animation: parpadeo 1.2s steps(2) infinite; }
  #msgs { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 26px 28px; }
  #msgs .vacio { color: var(--gris); font: 600 24px/1.4 var(--sans); text-align: center; margin: auto 0; }
  /* Riel: los mensajes ya leídos, de a una línea. Foco: el último, completo. */
  #riel { flex: none; display: flex; flex-direction: column; gap: 10px; }
  #riel:not(:empty) { padding-bottom: 20px; margin-bottom: 22px; border-bottom: 3px solid var(--linea); }
  .r { display: flex; align-items: center; gap: 14px; min-width: 0; color: var(--c); }
  .r .av { flex: none; width: 40px; height: 40px; background: var(--c); overflow: hidden; }
  .r .av img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .r b { flex: none; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; }
  .r span { min-width: 0; flex: 1; font: 600 22px/1.2 var(--sans); color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foco { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .f { --t: 34px; display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 18px; row-gap: 6px; animation: entra .4s steps(6) both; }
  .f .av { grid-row: 1 / 3; width: 56px; height: 56px; background: var(--c); overflow: hidden; }
  .f .av img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .f .nom { font-weight: 700; font-size: 21px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); align-self: end; }
  .f .nom small { font-size: 16px; color: var(--gris); margin-left: 12px; letter-spacing: .04em; }
  .f .cuerpo { font: 600 var(--t)/1.36 var(--sans); color: var(--papel); overflow-wrap: anywhere; }
  .f .cuerpo p { margin: 0 0 .5em; }
  .f .cuerpo .it { margin: .9em 0 .1em; font-weight: 700; }
  .f .cuerpo .it i { font-style: normal; color: var(--c); margin-right: .45em; }
  .f .cuerpo .de { margin: 0 0 .1em; padding-left: 1.35em; color: var(--gris); font-weight: 600; }
  .f .a { color: #ffb48a; }
  #foco.recortado { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent); }
  #msgs.recortado::after { content: 'sigue en el canal'; position: absolute; right: 28px; bottom: 26px; padding: 4px 10px; background: var(--panel); color: var(--naranja); font: 700 17px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .f.persona .cuerpo { padding: 12px 14px; margin: 6px -14px 0; background: color-mix(in srgb, var(--c) 12%, transparent); }
  @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  #trabajando { flex: none; min-height: 74px; padding: 18px 28px; border-top: 4px solid var(--linea); font-size: 21px; letter-spacing: .06em; text-transform: uppercase; color: var(--gris-bajo); display: flex; align-items: center; gap: 12px; }
  #trabajando.on { color: var(--papel); } #trabajando.on::before { content: ''; flex: none; width: 12px; height: 12px; background: var(--naranja); animation: parpadeo .9s steps(2) infinite; }

  #redactar { flex: none; display: flex; padding: 14px 28px 22px; }
  #texto { display: block; width: 100%; height: 64px; max-height: 230px; resize: none; overflow-y: auto; font: 600 26px/1.3 var(--sans); color: var(--papel); background: #1b1b2b; border: 3px solid var(--linea); padding: 12px 16px; outline: none; border-radius: 0; }
  #manija { position: absolute; top: 0; right: -10px; width: 20px; height: 100%; cursor: col-resize; z-index: 30; touch-action: none; }
  #manija::after { content: ''; position: absolute; left: 8px; top: 50%; width: 4px; height: 90px; margin-top: -45px; background: #4a4f78; opacity: .0; transition: opacity .15s; }
  #manija:hover::after, #manija.arrastrando::after { opacity: 1; background: var(--naranja); }
  #texto:focus { border-color: var(--naranja); }
  #texto:disabled { opacity: .5; }
  #texto::placeholder { color: var(--gris); }

  /* Esquinas "de pixel": recorte escalonado de 4 px */
  .px { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }

  .sala-cartel { position: absolute; background: var(--ink); padding: 2px 8px; font-size: calc(14px * var(--u)); font-weight: 700; letter-spacing: 0; text-transform: uppercase; color: #dfe2f5; opacity: .9; white-space: nowrap; }

  .pj { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .tag { position: absolute; left: 0; top: calc(10px * var(--u)); transform: translateX(-50%); background: var(--ink); color: var(--papel); padding: calc(3px * var(--u)) calc(8px * var(--u)); font-size: calc(15px * var(--u)); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .pj.persona .tag { background: var(--naranja); color: var(--ink); }
  /* Globos: sans legible, hasta 4 líneas; el texto completo está en el chat */
  .bub { position: absolute; left: 0; bottom: calc(112px * var(--u)); transform: translateX(-50%); width: max-content; max-width: 380px; background: var(--ink); padding: 4px; opacity: 0; transition: opacity 180ms steps(3); }
  .bub span { display: block; background: var(--papel); color: var(--ink); padding: 12px 16px; font: 700 25px/1.3 var(--sans); clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }
  .bub span i { font-style: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .bub.visible { opacity: 1; }
  .bub::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 12px; height: 12px; margin-left: -6px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 100% 40%, 66% 40%, 66% 70%, 33% 70%, 33% 40%, 0 40%); }
  .pj.abajo .bub::after { bottom: auto; top: -10px; transform: scaleY(-1); }

  /* El momento de la decisión: mientras la propuesta espera, un cartel junto a la persona; al decidir, la escuela se atenúa y la persona queda en foco. */
  .espera { position: absolute; left: 0; top: calc(10px * var(--u) + 46px); transform: translateX(-50%); display: none; align-items: center; gap: 12px; background: var(--papel); color: var(--ink); padding: 8px 16px; font: 700 26px/1 var(--sans); white-space: nowrap; }
  .espera.on { display: flex; }
  .espera::before { content: ''; width: 14px; height: 14px; background: var(--azul); animation: respiro 2.2s cubic-bezier(.25, 1, .5, 1) infinite; }
  @keyframes respiro { 50% { opacity: .25; } }
  #velo { position: absolute; inset: 0; z-index: 500; pointer-events: none; opacity: 0; transition: opacity 600ms cubic-bezier(.25, 1, .5, 1);
    background: color-mix(in srgb, var(--papel) 82%, transparent);
    -webkit-mask-image: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), transparent 0, transparent 190px, #000 460px); mask-image: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), transparent 0, transparent 190px, #000 460px); }
  .enfoque #velo { opacity: 1; }
  .pj .tag { transition: opacity 300ms; }
  .enfoque .pj:not(.persona) .bub { opacity: 0; }
  .enfoque .pj:not(.persona) .tag { opacity: .4; }
  .bub.decision { max-width: 620px; }
  .bub.decision span { background: var(--azul); color: var(--papel); font-size: 36px; line-height: 1.25; padding: 18px 24px; }
  .bub.decision.visible span { animation: sube .5s steps(5) both; }
  @keyframes sube { from { transform: translateY(16px); } to { transform: none; } }
  .bub.decision span i { -webkit-line-clamp: 5; }

  /* Controles: aparecen al mover el mouse */
  #barra { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--ink); padding: 8px; opacity: 0; transition: opacity 200ms; pointer-events: none; z-index: 20; }
  #barra.visible { opacity: 1; pointer-events: auto; }
  #barra button, #barra select { font: 700 20px var(--mono); letter-spacing: .06em; text-transform: uppercase; background: #2c2f48; color: var(--papel); border: 0; padding: 10px 16px; cursor: pointer; }
  #barra button:focus-visible, #barra select:focus-visible, #clave button:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
  #barra button:hover, #barra select:hover { background: #3c4066; }
  #barra button.on { background: var(--verde); color: var(--ink); }
  @keyframes parpadeo { 50% { opacity: .2; } }
  #clave { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); width: 560px; background: var(--ink); padding: 20px; display: none; flex-direction: column; gap: 12px; z-index: 21; color: var(--papel); }
  #clave.abierto { display: flex; }
  #clave label { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
  #clave input { font: 700 20px ui-monospace, Menlo, monospace; background: var(--papel); color: var(--ink); border: 0; padding: 12px 14px; width: 100%; margin-top: 8px; }
  #clave .fila { display: flex; gap: 8px; }
  #clave button { font: 700 18px var(--mono); letter-spacing: .06em; text-transform: uppercase; background: var(--verde); color: var(--ink); border: 0; padding: 12px 18px; cursor: pointer; }
  #clave button.sec { background: #2c2f48; color: var(--papel); }
  #clave .msg { font: 500 17px ui-monospace, Menlo, monospace; line-height: 1.4; min-height: 40px; color: #cfd3ea; }
  #ir-org { position: absolute; right: 14px; top: 10px; z-index: 20; background: var(--ink); color: var(--papel); padding: 8px 14px; font: 700 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
  #ir-org kbd { font: inherit; background: var(--linea); padding: 2px 8px; margin-left: 8px; }
  #ir-org:hover, #ir-org:focus-visible { background: var(--naranja); color: var(--ink); outline: none; }
  @media (prefers-reduced-motion: reduce) { .bub { transition: none; } .f { animation: none; } #velo { transition: none; } .espera::before { animation: none; } .bub.decision.visible span { animation: none; } #chat-estado.vivo::before, #trabajando.on::before { animation: none; } }
  #org { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 50; display: none; background: var(--fuera); }
  #org.abierto { display: block; }
</style>
</head>
<body>
<iframe id="org" title="Organigrama"></iframe>
<div id="escenario">
  <aside id="chat">
    <div id="chat-cab"><span class="canal"><b>#</b>coordinacion</span><span id="chat-estado">Grabación</span></div>
    <div id="msgs"><div class="vacio">Todavía no habló nadie. La escuela está en silencio.</div></div>
    <div id="trabajando"></div>
    <div id="manija" title="Arrastrá para mover el chat ( [ y ] )"></div>
    <form id="redactar" autocomplete="off"><textarea id="texto" rows="1" disabled placeholder="@Coordinación …" spellcheck="false"></textarea></form>
  </aside>
  <div id="mundo">
    <canvas id="lienzo"></canvas>
    <div id="velo"></div>
    <div id="capa"></div>
    <a id="ir-org" class="px" href="organigrama.html">Organigrama <kbd>o</kbd></a>
    <div id="clave">
      <label>Clave privada (nsec) · canal #coordinacion<input id="nsec" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="fila"><button id="btn-conectar">Conectar</button><button class="sec" id="btn-cerrar">Cerrar</button></div>
      <div class="msg" id="estado-vivo">La clave no sale de esta pestaña.</div>
    </div>
    <div id="barra">
      <button id="btn-prev" title="Paso anterior (←)">‹</button>
      <button id="btn-play" title="Play / pausa (espacio)">Pausa</button>
      <button id="btn-next" title="Paso siguiente (→)">›</button>
      <select id="velocidad" title="Velocidad"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button id="btn-org" title="Organigrama (o)">Organigrama</button>
      <button id="btn-grab" title="Reproducir la corrida grabada (g)">Grabación</button>
      <button id="btn-vivo" title="Conectar al relay (v)">En vivo</button>
    </div>
  </div>
</div>

<script type="module">
import { crearNormalizador } from './normalizar.js';
import { crearOficina, SALAS, W, H, CARTELES, MARTINA } from './oficina.js';
import { COLOR, MODELOS, cara } from './personajes.js';
import { crearHilo, trozos, bloques, primeraLinea } from './chat.js';

// Conexión fija: comunidad de Escuela Futura, canal #coordinacion.
const RELAY = 'wss://escuelafutura.communities.buzz.xyz';
const CANAL = 'e1343f4a-82ac-4627-846f-3b460f886466';

const $ = (id) => document.getElementById(id);
const mundo = $('mundo'), escenario = $('escenario');
const params = new URLSearchParams(location.search);
const K = 1200 / W;   // píxeles del escenario (1920×1080) por píxel lógico de la escuela: 3,75

let CONFIG = { agentes: [], personas: { casa: 'direccion', nombrePorDefecto: 'Dirección' } };
let ofi = null, fichas = null;
let eventos = [], indice = 0, reloj = 0, reproduciendo = false, velocidad = 1, ultimoFrame = 0;
let temporizadores = [], decisionPendiente = null, modoVivo = false, ws = null;
const programar = (ms, fn) => { const t = { t: reloj + ms, fn }; temporizadores.push(t); return t; };


// ── Chat del canal (columna izquierda) ───────────────────────────────────────
const caraUrl = {};   // la cara de cada personaje (la misma de la escuela) como imagen, para el chat
function urlDeCara(id) { const k = id || 'persona'; if (!caraUrl[k]) caraUrl[k] = cara(ofi.hojas[MODELOS[k]], 4).toDataURL(); return caraUrl[k]; }
const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const agenteDe = (nombre) => { const n = sinTildes(nombre); const a = CONFIG.agentes.find((x) => sinTildes(x.nombre) === n || x.id === n); return a ? a.id : null; };
const hilo = crearHilo();
const VACIO = '<div class="vacio">Todavía no habló nadie. La escuela está en silencio.</div>';
const RIEL = 4;   // mensajes ya leídos que quedan arriba, de a una línea
function chatLimpiar() { hilo.limpiar(); $('msgs').innerHTML = VACIO; }
function cara_(id) { const av = document.createElement('div'); av.className = 'av px'; const im = document.createElement('img'); im.src = urlDeCara(id); im.alt = ''; av.appendChild(im); return av; }
function conMenciones(el, linea) { for (const t of trozos(linea)) { if (t.mencion) { const a = document.createElement('span'); a.className = 'a'; a.textContent = t.texto; el.appendChild(a); } else el.appendChild(document.createTextNode(t.texto)); } return el; }
function chatDibujar(animar = true) {
  const cont = $('msgs'); const ms = hilo.mensajes;
  if (!ms.length) { cont.innerHTML = VACIO; cont.classList.remove('recortado'); return; }
  const ultimo = ms[ms.length - 1];
  const idDe = (m) => agenteDe(m.autor);
  const riel = document.createElement('div'); riel.id = 'riel';
  for (const m of ms.slice(Math.max(0, ms.length - 1 - RIEL), -1)) {
    const id = idDe(m); const r = document.createElement('div'); r.className = 'r'; r.style.setProperty('--c', COLOR[id] || COLOR.persona);
    const nom = document.createElement('b'); nom.textContent = m.autor || 'Alguien';
    const resumen = document.createElement('span'); resumen.textContent = primeraLinea(m.texto);
    r.append(cara_(id), nom, resumen); riel.appendChild(r);
  }
  const id = idDe(ultimo);
  const f = document.createElement('div'); f.className = 'f' + (id ? '' : ' persona'); f.style.setProperty('--c', COLOR[id] || COLOR.persona);
  const nom = document.createElement('div'); nom.className = 'nom'; nom.textContent = ultimo.autor || 'Alguien';
  if (ultimo.hora) { const h = document.createElement('small'); h.textContent = ultimo.hora; nom.appendChild(h); }
  const cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
  for (const b of bloques(ultimo.texto)) {
    const el = document.createElement('div');
    if (b.tipo === 'item') { el.className = 'it'; const n = document.createElement('i'); n.textContent = b.n + '.'; el.appendChild(n); }
    else el.className = b.tipo === 'detalle' ? 'de' : 'p';
    cuerpo.appendChild(conMenciones(el, b.texto));
  }
  f.append(cara_(id), nom, cuerpo);
  if (!animar) f.style.animation = 'none';   // al reacomodar (ancho, ventana) no se repite la entrada
  const foco = document.createElement('div'); foco.id = 'foco'; foco.appendChild(f);
  cont.replaceChildren(riel, foco);
  ajustarFoco();
}
// El último mensaje se muestra completo: se achica la letra (hasta 21 px) hasta que entre; si aun así no entra, se desvanece y se avisa.
function ajustarFoco() {
  const cont = $('msgs'), foco = $('foco'), f = foco && foco.firstElementChild; if (!f) return;
  let t = 34; f.style.setProperty('--t', t + 'px');
  while (f.scrollHeight > foco.clientHeight && t > 21) { t -= 1; f.style.setProperty('--t', t + 'px'); }
  const corto = f.scrollHeight > foco.clientHeight; foco.classList.toggle('recortado', corto); cont.classList.toggle('recortado', corto);
}
new ResizeObserver(() => ajustarFoco()).observe($('msgs'));   // cambia el alto disponible (p. ej. al aparecer "Trabajando: …")
function chatAgregar({ clave, autor, texto, hora, t }) { if (hilo.agregar({ clave, autor, texto, hora, t })) chatDibujar(); }
let ultimoTrabajando = '', avisoHasta = 0;
function aviso(t) { const el = $('trabajando'); el.textContent = t; el.classList.add('on'); avisoHasta = performance.now() + 5000; ultimoTrabajando = '\0'; }
function actualizarTrabajando() {
  if (!fichas || performance.now() < avisoHasta) return;
  const ts = [...fichas.values()].filter((f) => !f.persona && f.trabajando).map((f) => f.nombre);
  const txt = ts.length ? 'Trabajando: ' + ts.join(', ') : 'La escuela está en calma.';
  if (txt === ultimoTrabajando) return; ultimoTrabajando = txt;

// Cada personaje tiene una cola de globos: lo que dice se lee de a uno, sin pisarse.

const alias = new Map();

  if (fichas.has(id)) return fichas.get(id);

function aplicar(ev) {
  if (ev.tipo === 'persona') {
    const p = personaFicha(ev.quien, ev.nombre);
    const decide = !!decisionPendiente;
    decir(p, ev.texto, decide ? 'decision' : 'msg');
    if (decide) enfocar(p, 6500);
    if (!modoVivo) chatAgregar({ autor: p.nombre, texto: ev.texto });
    if (decisionPendiente) { p.esperando = false; decisionPendiente = null; }
    return;
  }
  const f = fichas.get(ev.quien) || ofi.agregar(ev.quien, { nombre: ev.quien.replace('agente:', 'Agente '), casa: 'pasillo' });
  if (ev.tipo === 'inicio') { f.trabajando = true; return; }
  if (ev.tipo === 'fin') { f.trabajando = false; programar(2800, () => { if (!f.trabajando) ofi.ir(f, f.casa); }); return; }
  if (ev.tipo === 'herramienta') { if (ev.lugar) ofi.ir(f, ev.lugar); decir(f, ev.texto, 'tool'); return; }
  if (ev.tipo === 'piensa') { decir(f, ev.texto, 'tool'); return; }
  if (ev.tipo === 'dice') {
    const destinos = ev.a || [];
    const agentes = destinos.filter(esAgente), personas = destinos.filter((d) => d.startsWith('persona:'));
    const esPropuesta = /^\W*propuesta|para decidir|¿aprob|aprobás, editás/i.test(limpiar(ev.texto));
    decir(f, ev.texto);
    if (!modoVivo) chatAgregar({ autor: f.nombre, texto: ev.texto });

      const p = personaFicha(personas[0]); ofi.ir(f, p.casa);
      if (esPropuesta) { p.esperando = true; decisionPendiente = p; }
    } else if (agentes.length) {
      const hermanos = eventos.filter((e) => e.tipo === 'dice' && e.quien === ev.quien && Math.abs(e.t - ev.t) < 1500);
      const todos = [...new Set(hermanos.flatMap((e) => (e.a || []).filter(esAgente)))];
      if (todos.length > 1) ofi.ir(f, 'pasillo');
      else { const otro = fichas.get(agentes[0]); ofi.ir(f, otro.sala || otro.casa); }
    }
  }
}

function loop(ts) {

        enviarMensaje = (texto) => {   // un mensaje de la persona al canal, con p-tags para quien se @mencione
          const agentes = CONFIG.agentes.map((x) => x.nombre);
          const pubDe = (nombre) => { let mejor = null; for (const [pk, p] of Object.entries(perfiles)) if (sinTildes(p.nombre) === sinTildes(nombre) && (!mejor || p.t >= perfiles[mejor].t)) mejor = pk; return mejor; };   // si hay agentes viejos con el mismo nombre, el más reciente
          const nombres = new Set();
          for (const mm of texto.matchAll(/@([A-Za-zÁÉÍÓÚáéíóúñÑ]+)/g)) {
            const n = sinTildes(mm[1]);
            if (n === 'todos' || n === 'equipo') agentes.forEach((x) => nombres.add(x));
            else { const ag = agentes.find((x) => sinTildes(x) === n); if (ag) nombres.add(ag); }
          }
          let contenido = texto;
          if (!nombres.size) { nombres.add('Coordinación'); contenido = '@Coordinación ' + texto; }   // sin @mención, le habla a Coordinación (solo contestan los mencionados)
          const tags = [['h', CANAL]];
          for (const nombre of nombres) { const pk = pubDe(nombre); if (pk) tags.push(['p', pk]); }
          return send(['EVENT', finalizeEvent({ kind: 9, created_at: Math.floor(Date.now() / 1000), tags, content: contenido }, sk)]);
        };
        actualizarEstado();
        estadoVivo('Conectado a #coordinacion. Escuchando a los agentes.'); $('clave').classList.remove('abierto');
        const since = Math.floor(Date.now() / 1000) - 120;
        send(['REQ', 'vivo-obs', { kinds: [24200], '#p': [myPub], since, limit: 500 }]);
        send(['REQ', 'vivo-perfiles', { kinds: [0], limit: 200 }]);
        send(['REQ', 'vivo-canal', { '#h': [CANAL], since, limit: 200 }]);
        send(['REQ', 'chat-hist', { kinds: [9, 40002], '#h': [CANAL], limit: 30 }]);   // el chat arranca con lo último que se habló
      } else if (type === 'OK' && b === false) { aviso('El relay rechazó el mensaje: ' + (msg[3] || ''));
      } else if (type === 'EOSE' && a === 'chat-hist') {
        historia.sort((x, y) => x.created_at - y.created_at).forEach((e) => chatAgregar({ clave: e.id, autor: nombreDe(e.pubkey), texto: textoPlano(e.content), hora: hora(e.created_at), t: e.created_at }));
        historia = null;
      } else if (type === 'EVENT') {
        const ev = b;
        if (ev.kind === 0) { try { const p = JSON.parse(ev.content); perfiles[ev.pubkey] = { nombre: p.display_name || p.name || (perfiles[ev.pubkey] || {}).nombre, t: ev.created_at }; } catch {} }
        if (ev.kind === 9 || ev.kind === 40002) {
          const h = (ev.tags.find((t) => t[0] === 'h') || [])[1];
          if (h === CANAL) { if (a === 'chat-hist' && historia) historia.push(ev); else chatAgregar({ clave: ev.id, autor: nombreDe(ev.pubkey), texto: textoPlano(ev.content), hora: hora(ev.created_at), t: ev.created_at }); }
          if (a === 'chat-hist') return;      // la historia solo llena el chat; no mueve a nadie
        }
        if (ev.kind === 24200) { try { ev._descifrado = JSON.parse(N44.decrypt(ev.content, convKey(sk, ev.pubkey))); } catch { return; } }
        const nuevos = procesar([ev]); if (!nuevos.length) return;
        if (tBase == null) tBase = nuevos[0].t;
        for (const n of nuevos) { n.t = n.t - tBase; eventos.push(n); }
        eventos.sort((x, y) => x.t - y.t);
        for (const n of nuevos) { aplicar(n); indice = eventos.length; }
      } else if (type === 'CLOSED') estadoVivo('El relay cerró una suscripción: ' + b);
    };
  } catch (e) { estadoVivo('Error: ' + e.message); falla(e.message); }
}
// Si nunca se pudo conectar, la vista cae sola a la corrida grabada (plan B); si ya conectó una vez, reintenta.
function falla(motivo) {
  console.warn('En vivo:', motivo);
  if (huboConexion && deseaVivo) { textoEstado = 'Reconectando…'; actualizarEstado(); reconectar = setTimeout(() => conectar(nsecActual), 3000); return; }
  desconectar(); cargarGrabacion(); estadoVivo(motivo);
}
$('btn-conectar').onclick = () => { huboConexion = true; conectar($('nsec').value); };

async function cargarGrabacion() {
  const q = params.get('corrida') || 'corridas/2026-10-12-primer-anio-en-riesgo.eventos.json';
  const data = await (await fetch(q)).json();
  modoVivo = false; textoEstado = ''; cargarEventos(data.eventos);
  const paso = Number(params.get('paso'));
  if (paso > 0) irAlPaso(paso - 1); else if (params.get('auto') !== '0') setPlay(true);
}

// ── Arranque ─────────────────────────────────────────────────────────────────
// Por defecto se conecta sola al canal con la clave de stage/conexion.local.js (no se sube al repo).
// Sin ese archivo, o con ?grabacion=1, ?corrida=… o ?paso=N, arranca con la corrida grabada.
try {
  CONFIG = await (await fetch('agentes.json')).json();
  ofi = await crearOficina($('lienzo'));
  for (const t of CARTELES) { const c = document.createElement('div'); c.className = 'sala-cartel'; c.textContent = t.texto; c.dataset.x = t.x; c.dataset.y = t.y; $('capa').appendChild(c); }
  const m = document.createElement('div'); m.id = 'martina'; m.className = 'tag px'; m.textContent = 'Martina'; m.style.cssText = 'background:#ff7a3d;color:#1a1a2e'; $('capa').appendChild(m);
  escalar();
  reiniciar();
  const forzarGrabacion = params.get('grabacion') === '1' || params.has('corrida') || params.has('paso');
  let nsecLocal = null;
  if (!forzarGrabacion) { try { nsecLocal = (await import('./conexion.local.js')).NSEC; } catch { /* sin archivo: modo grabación */ } }
  if (nsecLocal) conectar(nsecLocal); else await cargarGrabacion();
} catch (e) { console.error(e); if (!ofi) document.body.insertAdjacentText('afterbegin', 'Abrí esta página con "./escenario" (ver README).'); }
requestAnimationFrame(loop);
</script>
